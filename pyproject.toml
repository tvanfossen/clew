[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clew-trace"
version = "1.1.3"
## The language clause below is GENERATED by scripts/sync_metadata.py from clew/languages.py,
## which derives it from the routing tables. Do not hand-edit it — five hand-maintained
## copies of this sentence is what went stale and reached a registry crawler.
# <clew:langs>Harvests symbols from C, C++, Rust, Python, JavaScript, TypeScript, shell and CMake; registers YAML, JSON, Perl and Make files by name without parsing them# </clew:langs>
description = "Queryable, layered symbol database served to AI agents over MCP: doxygen + tree-sitter call graph, threads, locks, dataflow and requirement edges, plus the clew guard pre-commit gate."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "doxygen",
    "documentation",
    "static-analysis",
    "call-graph",
    "tree-sitter",
    "mcp",
    "embedded",
    "traceability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pyyaml>=6.0,<8",
    # Capped at the next major (S1, 1.1.0 audit). Console rendering only — `rich.console`,
    # `rich.table`, `rich.panel` — so the exposure is cosmetic rather than structural, but an
    # unbounded major installs unreviewed into every new adopter. Installed: 15.x.
    "rich>=13.0,<16",
    # DECLARED, NOT LEFT TRANSITIVE VIA fastmcp. `pydantic.Field` carries the tool
    # parameters' descriptions into the JSON Schema, and the schema is the ONE
    # surface a client cannot truncate — measured, a third of every prose tool
    # description is cut before it reaches the model. Losing this import would take
    # the only untruncatable routing signal to zero, so the version window is ours
    # to state rather than fastmcp's to change under us.
    "pydantic>=2.0,<3",
    # The shared Rust parsing substrate (knots, moldy, aurora-lint), through its PyO3
    # wheels. Capped at the next minor: it is 0.x, so a minor release may break the API.
    # It parses every language for every harvester and the gate (`parse_tree`, wrapped
    # by clew/tsnode.py; 0.11 is the first release with it), which is why neither
    # py-tree-sitter nor any per-language grammar package is a dependency. It also
    # supplies the gate's extension -> language table, classifies binaries out of every file walk
    # (classify_file, 0.11.1) and matches toolchain.toml globs (PathIgnore, 0.11.1).
    # 0.11.2 makes `parse_tree`'s flat-tree copy ~25% cheaper. 0.12.0 is the first
    # published wheel with the bash, cmake, yaml, json and markdown grammars that the
    # script front ends (clew/shast.py, clew/cmakeast.py) parse with, and the
    # `markdown_sections` that clew/prose.py chunks prose by.
    # NOT optional: losing it takes every AST layer to zero rows.
    "lang-parsing-substrate>=0.12.0,<0.13",
    # Pinned <15: reads Kconfig.unique_defined_syms, unique_choices,
    # Symbol.orig_type, MenuNode.prompt/help/filename/linenr, expr_str.
    "kconfiglib>=14,<15",
    # Floored at 2: 1.x had mcp.server.fastmcp, which 2.0.0 deleted. Capped at 3:
    # an unbounded major range already shipped a broken `init` once.
    "mcp>=2,<3",
    # `anyio.run(...)` IS the MCP server's main loop, so a major that changes task-group or
    # cancellation semantics changes how the server shuts down. Capped at the next major.
    "anyio>=4.0,<5",
    "mcp-types>=2,<3",
    # tomllib is stdlib only from 3.11; below that the backport IS the parser.
    'tomli>=2,<3; python_version < "3.11"',
]

[project.scripts]
clew = "clew.cli:main"
clew-mcp = "clew.mcp_server.server:main"
## The PostToolUse hook. A console script rather than a shell file so the plugin never ships a
## shell command line, and so the entry point is the same installed package the server is.
clew-hook = "clew_hook:main"
## The doxygen gate (absorbed doxygen-guard). The same entry point as `clew guard`; a console
## script of its own because it is what the published pre-commit hook runs.
clew-guard = "clew.guard.main:cli_main"

[project.optional-dependencies]
dev = [
    # BOUNDED LIKE THE RUNTIME SET, and for a reason that is not merely tidiness: these four
    # ARE the release gate. A pytest or pre-commit major landing unreviewed changes what
    # "green" means on the commit that ships, which is the one moment nobody re-reads the
    # tooling. Installed: pytest 9.1, pre-commit 4.6, build 1.6, twine 7.0.
    "pytest>=8.0,<10",
    "pre-commit>=3.6,<5",
    "build>=1.0,<2",
    "twine>=5.0,<8",
]

[project.urls]
Homepage = "https://github.com/tvanfossen/clew"
Repository = "https://github.com/tvanfossen/clew"
Issues = "https://github.com/tvanfossen/clew/issues"

[tool.hatch.build.targets.wheel]
## The hook is a TOP-LEVEL module, not a package submodule, so invoking it does not import
## `clew/__init__` and pay 157ms of pipeline imports on every matching tool call.
##
## `only-include`, NOT `py-modules`. `py-modules` is a SETUPTOOLS key; hatchling neither reads
## nor rejects it, so it parsed, validated, published — and the wheel shipped a `clew-hook`
## console script whose module was not in it. Every consumer's hook would have raised
## ModuleNotFoundError on every Bash call. The editable install cannot see this, because its
## `.pth` puts the source root on `sys.path` and `import clew_hook` succeeds locally either way.
## This is the project's own most-repeated defect — an accepted-but-unread key — reached through
## the build backend. `test_wheel_contains_every_console_script_module` is the guard.
only-include = ["clew", "clew_hook.py"]

## SKILLS.md IS THE ONE DOCUMENT A CONSUMER IS POINTED AT, AND 1.1.0 SHIPPED WITHOUT IT. It stays
## canonical at the repository root — `AGENTS.md` links it by that path and so does the README —
## and `force-include` maps it *into* the package for the wheel rather than copying it into
## `clew/`, so there is one file in the tree and no second copy to drift.
##
## INSIDE THE PACKAGE, NOT AT THE ARCHIVE ROOT. A top-level `.md` in a wheel installs loose into
## `site-packages`, where it belongs to nobody and collides by name with any other distribution
## that does the same. At `clew/SKILLS.md` it installs to a path `importlib.resources` can reach.
##
## AGENTS.md IS DELIBERATELY NOT HERE. It routes someone *changing* clew, and that audience has
## the tree checked out; shipping it to an installed consumer would be guidance they cannot act on.
[tool.hatch.build.targets.wheel.force-include]
"SKILLS.md" = "clew/SKILLS.md"

[tool.hatch.build.targets.sdist]
include = [
    "/clew",
    "/clew_hook.py",
    "/tests",
    "/docs",
    "/README.md",
    ## BOTH ENTRY-POINT DOCUMENTS. This list is an ALLOWLIST, so a document added to the tree after
    ## it was written is absent by default — which is exactly how 1.1.0 published an sdist missing
    ## the two files `AGENTS.md` names as the two places to start.
    "/SKILLS.md",
    "/AGENTS.md",
    "/LICENSE",
    "/requirements.yaml",
    "/.clew.yaml",
    "/.pre-commit-config.yaml",
    "/.pre-commit-hooks.yaml",
]
exclude = [
    "/.claude",
    "/workspace",
    "/docs/generated",
    "**/__pycache__",
    "**/*.pyc",
]

[tool.pytest.ini_options]
## KEEP THE CACHE OUT OF THE REPO ROOT. Without this table pytest has no config file here and
## defaults to `./.pytest_cache`, so the root grew a cache directory beside `.cache/`, which
## already holds `ruff/` and this project's own scratch. Two conventions in one tree is the state
## someone later "tidies" by deleting the wrong one.
cache_dir = ".cache/pytest"
