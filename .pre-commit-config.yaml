---
exclude: |
  (?x)^(
    \.venv/.*|
    \.claude/.*|
    workspace/.*|
    docs/generated/.*|
    acceptance/targets/.*|
    acceptance/runs/.*|
    tests/data/.*|
    tests/guard/fixtures/.*|
    .*\.egg-info/.*
  )$

repos:
  - repo: https://github.com/brandon-arrendondo/knots
    rev: ba5800f1a8f49e07021f7019ca2b6b2eafc4c61b # v1.15.1
    hooks:
      - id: knots

  ## The gate is clew's own code now (clew/guard/), so this repo runs it from its own tree
  ## rather than a published rev: a change to the gate is exercised by the very commit that
  ## makes it. Adopting repos use the published hook in .pre-commit-hooks.yaml instead.
  ## The ID stays `doxygen-guard` — clew/precommit.py finds the hook by that ID.
  - repo: local
    hooks:
      - id: doxygen-guard
        name: doxygen-guard (clew guard)
        entry: .venv/bin/python -m clew guard
        language: system
        args: [validate]
        files: ^(clew|acceptance|tests)/.*\.py$
        require_serial: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 39d9ac5938dadb73df0564a45f163e25ff9fa6e2 # v0.16.1
    hooks:
      - id: ruff
        args: ["--fix", "--select=E4,E7,E9,F", "--target-version=py310", "--cache-dir=.cache/ruff"]
      - id: ruff-format
        args: ["--line-length=100", "--target-version=py310", "--cache-dir=.cache/ruff"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=512']
      - id: check-merge-conflict
      - id: check-symlinks
      - id: mixed-line-ending

  ## FIRST, BEFORE ANYTHING EXPENSIVE. If the gate cannot see the whole tree, the result of every
  ## hook after this one is a claim about a subset — and `843764f` shipped a red release exactly
  ## that way: green `--all-files`, then 1,637 untracked artifacts staged and committed, which
  ## `end-of-file-fixer` had never been shown. Learning that after a 3-minute pytest run wastes
  ## the run; learning it after the release workflow does, wastes the release.
  - repo: local
    hooks:
      - id: gate-hygiene
        name: gate-hygiene (can this gate see the tree?)
        entry: .venv/bin/python scripts/gate_hygiene.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        ## `cache_dir` is set once, in pyproject's `[tool.pytest.ini_options]`. It used to be
        ## overridden here as well, which is two places for one setting and therefore one place
        ## to forget when it changes.
        ## BOTH TIERS, and the unit tier alone is why a red test survived a release. The
        ## integration tier was opt-in behind `--integration`, so nothing in the gate ever ran
        ## it: `test_a_stated_preprocessor_section_reaches_the_stage_through_the_declaration`
        ## was failing at the 1.0.1 release point and stayed invisible through 1.0.2. A tier
        ## that vets source before release has to run before release.
        ##
        ## `acceptance/bench/` stays OUT deliberately — those are matrix/harness tests about a
        ## measurement, not about this source, and they are gated separately.
        ##
        ## The cost is real and accepted: ~59s unit + ~124s integration.
        ## ONE DEFINITION, and it lives in the script. The arguments used to be this
        ## literal, which is a fine single source for the GATE and none at all for a human:
        ## running `pytest tests/ -q` by hand deselects the integration tier and reports
        ## green on a tree this rejects, and reproducing a CI matrix leg meant retyping the
        ## arguments against another interpreter. `scripts/run_tests.py --python 3.10` is
        ## now that operation, using these exact arguments.
        entry: .venv/bin/python scripts/run_tests.py
        language: system
        pass_filenames: false
        always_run: true
