# SPDX-License-Identifier: MIT

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: pre-commit (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    # A HUNG STEP MUST FAIL, NOT WAIT. Without this the job inherits GitHub's 6-hour
    # default, and a stalled `apt-get install doxygen` — observed once, on one runner of
    # three, while the other two passed the same commit — blocks a release for hours while
    # looking exactly like a slow one. That ambiguity is the real cost: nothing
    # distinguishes "stuck" from "still going" until someone reads the step list by hand.
    #
    # 20 minutes is roughly 4x the observed full-matrix run (~2m of pytest plus setup) with
    # room for a cold pre-commit cache, so a legitimately slow leg still passes and a wedged
    # one fails inside a coffee break. Raise it if the suite grows, do not remove it.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen

      - name: Create .venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: .venv/bin/pre-commit run --all-files --show-diff-on-failure

  # round 3, P6c: clew builds its OWN wiki from the checkout — the gate's tests with coverage,
  # the last commit's change impact, then the composite action adopters use (installing this
  # checkout, since the release it would pin is not published yet). The site is uploaded as an
  # artifact, which pages.yml deploys to GitHub Pages after a green run on `main` (owner 2026-11-23;
  # the deploy was meant to switch on at the 2.0.0 cut, owner 2026-11-16).
  wiki:
    name: wiki
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Tests with coverage (the wiki's evidence)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
          .venv/bin/python scripts/run_tests.py --coverage
      - name: Change impact of the last commit
        run: |
          .venv/bin/python -m clew guard impact --range HEAD~1..HEAD $(git diff --name-only HEAD~1 HEAD -- 'clew/*.py')
      # 2.1: the dossier flow's real values (X-2) come from this one traced test, written where
      # `.clew.yaml` `tests.traces` reads; recorded here so the published wiki carries them.
      - name: Traced run for the wiki's replay values
        run: |
          .venv/bin/clew wiki trace-run --test tests/test_mcp_server.py::test_the_dossier_body_caps_and_reports_truncation --out build/traces/dossier.json
      - uses: ./.github/actions/wiki
        id: wiki
        with:
          install-from: .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clew-wiki
          path: ${{ steps.wiki.outputs.site }}

  build:
    name: build
    runs-on: ubuntu-24.04
    # Same reasoning as `gate` above; this job only builds a wheel, so it is tighter.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check --strict dist/*
