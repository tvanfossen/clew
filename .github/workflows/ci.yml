# SPDX-License-Identifier: MIT

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: pre-commit (py${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    # A HUNG STEP MUST FAIL, NOT WAIT. Without this the job inherits GitHub's 6-hour
    # default, and a stalled `apt-get install doxygen` — observed once, on one runner of
    # three, while the other two passed the same commit — blocks a release for hours while
    # looking exactly like a slow one. That ambiguity is the real cost: nothing
    # distinguishes "stuck" from "still going" until someone reads the step list by hand.
    #
    # 20 minutes is roughly 4x the observed full-matrix run (~2m of pytest plus setup) with
    # room for a cold pre-commit cache, so a legitimately slow leg still passes and a wedged
    # one fails inside a coffee break. Raise it if the suite grows, do not remove it.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen

      - name: Create .venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install -e '.[dev]'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ matrix.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - run: .venv/bin/pre-commit run --all-files --show-diff-on-failure

  build:
    name: build
    runs-on: ubuntu-24.04
    # Same reasoning as `gate` above; this job only builds a wheel, so it is tighter.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: twine check --strict dist/*
