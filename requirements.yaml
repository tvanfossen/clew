# clew requirements catalog (dogfooding).
#
# Flat schema doxygen-guard reads: {id, block, title, acceptance, priority}.
# Extra keys {status, evidence} are clew's own live implementation-tracking
# view (the guard ignores unknown keys; @req COVERAGE is NOT gated yet — see
# REQ-DDB-CONFIG-002). clew controls its OWN flat format here; arbitrary
# target repos' catalog shape is read from THEIR .doxygen-guard.yaml declaration
# (STRICTLY NO HARDCODING).
#
# @req id shape (declared in .doxygen-guard.yaml):
#   ^REQ-DDB-[A-Z]+-[0-9]{3}( \[inferred\])?$
# The optional suffix is a CONFIDENCE marker, not part of the id. It is in the
# pattern because doxygen-guard validates the whole `@req` line while clew
# splits id from marker — see the comment on that key for why declaring it was the
# honest fix rather than deleting the marker.
# Product domains only: PIPE, SCHEMA, QUERY, MCP, CONFIG, INDEX, CLI.
#
# `evidence:` IS PROSE AND IT DRIFTS. As of task #62 the machine-checkable link is
# `@req REQ-DDB-*` tags in the source, queryable with `req_trace`; evidence is a
# reading aid, ranked BELOW the tags. Every field below was re-verified against
# the tree on 2026-07-30, and the drift found was substantial: fifteen entries
# cited spec documents that no longer exist under any name (R1-SPEC.md /
# R2-SPEC.md / R4-SPEC.md / PIVOT.md / PLAN-round2.md), one cited a test file
# renamed long ago, four asserted "(verified) unbuilt" about subsystems that ship,
# and one pinned a build-version constant seven bumps behind. That is the exact
# failure doxygen-guard exists to prevent, occurring inside doxygen-guard's own
# toolchain — which is why traceability now lives in tags.
#
# A requirement with NO implementer is left with none ON PURPOSE. Three are:
# CONFIG-002 is satisfied by configuration rather than by any function, and
# SCHEMA-008 / SCHEMA-010 are unbuilt. Inventing a mapping to raise the count
# would put a falsehood where a tool will repeat it confidently to every future
# reader.

requirements:
  REQ-DDB-CLI-001:
    subsystem: cli
    name: Six-argument build CLI, every declaration stated through one route
    acceptance_criteria: python -m clew accepts EXACTLY six build arguments — --output (the
      only required one), --repo-root, --declare FILE, --exclude, --rebuild, --verbose — and no others.
      Every declared convention is stated through --declare (or the target's own .clew.yaml, or
      the `options` argument of build_index / index(action='refresh')); all three routes go through
      buildoptions.apply_options, so they validate identically and land on the same dests.
    x-priority: P1
    x-status: implemented
    x-evidence: 'clew/cli.py _build_argparser + _FOLDED_BUILD_DEFAULTS + _apply_declared_document
      + _apply_declared_paths. COLLAPSED 22 -> 6: eight arguments duplicated a declaration section, so
      one fact had two spellings with a precedence rule between them. Every removed dest survives with
      its declared default (build_index sources defaults BY PARSING; apply_options assigns onto those
      dests), so no value MEANS anything different — pinned by tests/test_cli_surface.py, which asserts
      the exact six, that each folded dest still exists, and that the declaration route reaches the same
      stage the flag did. --guard-config was DELETED in favour of discover_guard_config rather than
      folded. --doxyfile/--scope/--index-cache stay reachable on the typed surface only.'
  REQ-DDB-CLI-002:
    subsystem: cli
    name: init registers the MCP server surgically, and doctors the environment
    acceptance_criteria: '`clew init` writes ONE file — the MCP client config — and writes it
      surgically: it parses the existing document, replaces exactly one entry under `mcpServers`,
      and re-serialises everything else byte-identically. A malformed target is REFUSED rather
      than rewritten. An identical entry is a no-op; a DIFFERING existing entry is refused with a
      diff unless --force. An overwrite leaves a backup. --scope repo writes <repo>/.mcp.json,
      --scope global writes the user-level Claude Code config, relocatable by CLAUDE_CONFIG_DIR.
      --dry-run prints the exact JSON and touches nothing. The same run reports a doctor line per
      check (client config, server command, MCP SDK, doxygen, indexable, declaration), and only
      the two write-invalidating checks may withhold the write; a missing binary reports non-zero
      WITH the config written, because the fix is an install rather than a config edit. It writes
      no other file: a CLAUDE.md belongs to the user.'
    x-priority: P1
    x-status: implemented
    x-evidence: 'clew/init_command.py — build_parser (four flags), diagnose (the six checks in
      reporting order), BLOCKING_CHECKS, _execute. The surgical merge and the atomic write are
      clew/mcp_config.py plan_merge / apply_plan (sibling temp file, backup before os.replace).
      tests/test_init.py asserts on BYTES rather than exit codes, including that the user-scope
      target resolves inside pytest''s temp tree before any test writes there.'
  REQ-DDB-CONFIG-001:
    subsystem: config
    name: No hardcoded repo conventions - read declarations (STRICTLY NO HARDCODING)
    acceptance_criteria: The @req id pattern (validate.tags.req.pattern) and requirements-catalog column
      mapping (impact.requirements.{id_column,name_column}) are read from the target repo's .doxygen-guard.yaml,
      never hardcoded; permissive fallback when no config exists.
    x-priority: P0
    x-status: implemented
    x-evidence: clew/requirements.py load_guard_config/resolve_req_id_pattern/resolve_catalog_columns;
      declaration.py load_declaration/section/declared_path (the .clew.yaml surface); precommit.py
      discover_guard_config/discover_guard_config_logged (the repo's own pre-commit hook DECLARES where
      its guard config lives, via the --config arg) and pinned_guard_rev (which release that config is
      written against); cli.py _declared_or_flag (explicit flag beats declaration); tests/test_requirements_declared.py,
      tests/test_declaration.py, tests/test_guard_config_discovery.py. The prior field named only the
      first two functions and so predated both resolve_catalog_columns and the whole declaration.py/precommit.py
      surface; it then cited precommit.py load_guard_declaration, which was DELETED with the guard tier
      of index-scope derivation (its compiled hook-level files/exclude filter had no consumer left).
  REQ-DDB-CONFIG-002:
    subsystem: config
    name: Dogfooding - clew enforces doxygen-guard + ruff + pytest on itself
    acceptance_criteria: clew carries .doxygen-guard.yaml, requirements.yaml, and .pre-commit-config.yaml;
      pre-commit runs ruff, doxygen-guard (presence/@version/@return), and the full pytest suite green
      on the package code.
    x-priority: P0
    coverage_exempt: satisfied by configuration FILES (.doxygen-guard.yaml, .pre-commit-config.yaml),
      not by any function — a tag here would have to be attached to something arbitrary
    x-status: partial
    x-evidence: 'NO IMPLEMENTER BY NATURE — satisfied by configuration files, not by any function, so
      it is deliberately left untagged. .doxygen-guard.yaml + .pre-commit-config.yaml are present and
      the hook set is ruff, ruff-format, doxygen-guard (pinned upstream at rev v1.3.1, not repo:local),
      single-path, oss-scrub and the full pytest suite. Still `partial` for one reason only: @req COVERAGE
      is not GATED — a requirement with no implementer does not fail the build. Tag coverage itself is
      no longer zero (task #62: 30 of 34 requirements have implementers).'
  REQ-DDB-CONFIG-003:
    subsystem: config
    name: clew owns a FLAT requirements schema (distinct from target-repo catalogs)
    acceptance_criteria: clew's own requirements.yaml uses flat {id, block, title, acceptance,
      priority} entries with id shape ^REQ-DDB-[A-Z]+-[0-9]{3}$, while arbitrary target catalogs' shapes
      are still read from THEIR declarations.
    x-priority: P1
    x-status: implemented
    x-evidence: 'This file''s header + .doxygen-guard.yaml req.pattern; tests/data/csample/requirements.yaml
      carries a target-repo shape that differs. Code link tagged [inferred], because the requirement is
      chiefly a property of a DATA file: requirements.py _is_flat_req_list / _keyed_req_entries / _insert_req_entry
      are the functions that read either shape.'
  REQ-DDB-CONFIG-004:
    subsystem: config
    name: The preprocessor configuration an index represents is DECLARED, and recorded
    acceptance_criteria: A target may declare `preprocessor.predefined` and/or `preprocessor.config_header`
      (an explicit repo-relative path, or `auto` for conventional discovery that REFUSES on
      two or more candidates); the resolved macros reach doxygen as `PREDEFINED +=` so a repo's
      own Doxyfile PREDEFINED survives, are covered by the index-cache tree hash so a changed
      declaration cannot serve a stale parse, and the source/header/macro list are persisted to
      build_meta under a `preprocessor.` prefix. A target declaring nothing builds identically.
    x-priority: P1
    x-status: implemented
    x-evidence: 'gh#17. clew/preprocessor.py resolve_preprocessor / macros_from_header /
      doxyfile_lines / _discover_config_header / PreprocessorConfig.as_meta; wired in cli.py
      _preprocessor / _doxygen_stage / _run_doxygen_from_args and doxygen.py _build_doxyfile_content /
      doxyfile_content_for / run_doxygen; persisted by signature.write_build_signature''s third
      prefix. tests/test_preprocessor.py. Part 3 (recording WHICH variant) is separable and
      load-bearing on its own: an index of a multi-variant codebase is an index of one variant,
      and nothing said which — so two indexes of one repo could disagree about whether a function
      exists with no field to explain it.'
  REQ-DDB-CONFIG-005:
    subsystem: config
    name: The Kconfig CONFIGURATION SPACE is discovered, stored and searchable
    acceptance_criteria: A repo's top-level Kconfig is located explicit-declaration-first
      (`kconfig.root`), then at the repo root, then among a fixed set of conventional application
      directories, REFUSING on two or more candidates; its symbols are stored with name, declared
      type, prompt, help, default expression (conditions kept) and the `choice` group they belong
      to; every prompt and help block is inserted into `supplementary_docs` so `search_prose`
      reaches a limitation documented nowhere else; and the discovery source, root, symbol/choice/
      documented counts and any PARSE ERROR are persisted to build_meta under a `kconfig.` prefix.
      A repo with no Kconfig creates no table, writes no row and builds identically. No resolved
      value is stored — the space is structure, the variant a build used is `preprocessor.*`.
    x-priority: P1
    x-status: implemented
    x-evidence: 'gh#18. clew/kconfig.py discover_kconfig / load_kconfig / store_kconfig /
      ingest_kconfig_prose / import_kconfig / KconfigModel.as_meta; wired in cli.py _build_stages
      immediately AFTER ingest_supplementary_docs, which DROPs the FTS table and would otherwise
      delete these rows silently. Persisted by signature.write_build_signature''s fourth prefix.
      tests/test_kconfig.py, fixture tests/data/kconfigsample. `kconfiglib` is a REQUIRED
      dependency, not an extra: optionality would give the layer two indistinguishable ways to be
      empty, which is this repo''s most-repeated defect. It does not make the capability
      unconditional, which is why `kconfig.error` is a first-class row — a Zephyr application
      indexed outside its west workspace legitimately fails to parse.'
  REQ-DDB-CONFIG-006:
    subsystem: config
    name: Layered options resolve through ONE five-tier precedence rule, and the winning tier
      is recorded
    acceptance_criteria: 'Every layered build option resolves through a single primitive
      implementing `resolved = (tier1 or tier2 or tier5) union tier3 union tier4` — an explicit
      flag or a declaration REPLACES the tier-5 name-pattern guesses, while tier-3 facts
      (language/platform entry points, a target''s own manifests) and tier-4 known-ecosystem
      signatures ACCUMULATE and survive every stated tier. The primitive returns the resolved
      values bound to the tier that won, and the only producer of the `options.*` build_meta
      rows refuses anything but that object, so a value whose provenance was discarded cannot
      be stamped. A tier-1 statement is recorded and replayed by later builds of the same
      database (absent inherits, empty withdraws, non-empty replaces); a tier-2 declaration is
      not replayed, because it re-derives from a file that may have changed. A target stating
      nothing resolves to the full built-in set, facts and guesses together.'
    x-priority: P1
    x-status: implemented
    x-evidence: 'gh#319. clew/tiers.py resolve_layered / LayeredResolution.as_meta /
      options_meta / recorded_explicit; reachability.py splits the previously MIXED
      DEFAULT_ENTRY_PATTERNS into ENTRY_PATTERN_FACTS (tier 3) and ENTRY_PATTERN_HEURISTICS
      (tier 5); wired in cli.py _entry_patterns / _recorded_entry_patterns / _run_pipeline /
      _build_stages and persisted by signature.write_build_signature''s sixth prefix.
      propose/notindexed.py seeds_reachability is the second consumer of the split and is
      pinned to the resolver''s own no-statement result. tests/test_tiers.py. The defect that
      motivated it: "supersede" meant three different things across the pipeline, so passing
      --entry-patterns dropped `main`, reachability collapsed and nothing reported it.'
  REQ-DDB-CONFIG-007:
    subsystem: config
    name: The build reports what it could NOT see, as structured data, including zero
    acceptance_criteria: 'Every discovery diagnostic the build computes — accessor FAMILIES no
      active shared-key pattern covers, xrefitem ALIAS tags no active event vocabulary claims,
      and acquire/release PAIRS no active lock pattern covers (gh#385, added because the lock
      layer reported a confident `1` identity on a repo with five global mutexes and nothing
      told the owner that declaring one primitive would take it to 10)
      — are persisted to build_meta under a `diagnostics.` prefix and reported
      by `status`, and therefore by every `build_or_refresh` reply, NAMED and with their counts.
      A count of ZERO is written and reported: a silent zero is indistinguishable from a
      diagnostic that never ran, from an index built before the diagnostic existed, and from a
      target the diagnostic is structurally blind to. The accessor count is reported against the
      SIZE OF THE CORPUS it examined, so a zero states what was searched rather than only that
      nothing was found. The active event vocabulary''s SOURCE — a target''s own declaration
      versus the built-in verbs — is reported, so an operator can see whether their declaration
      took effect. The keys these diagnostics name are the keys the build surface accepts.'
    x-priority: P1
    x-status: implemented
    x-evidence: 'gh#320. clew/diagnostics.py BuildDiagnostics / collect / as_meta,
      persisted by signature.write_build_signature''s SEVENTH prefix and read back by the same
      query._common.meta_section every other section uses. Re-derived at the stamp site from the
      pure resolvers (shared_key_edges.resolve_shared_key_patterns +
      detect_undeclared_accessor_families, event_edges.classify_aliases) rather than widening
      three stage signatures for a metadata row — the choice cli.py already documents for
      key_alias_prefixes, and safe here because no COLUMN can disagree with it. The corpus
      predicate is shared as ACCESSOR_CORPUS_KINDS so the denominator cannot drift from the
      numerator. The defect: three capabilities had never been observed working on a real index,
      and "the diagnostic is silent" carries no information at all — this project has read a
      silent zero as a fact about a repository three times. tests/test_diagnostics.py.'
  REQ-DDB-CONFIG-008:
    subsystem: config
    name: TIER 1 is reachable from an embedding caller through ONE structured options argument
    acceptance_criteria: 'An embedding caller — `build_index`, and therefore the MCP
      `build_or_refresh` tool — can STATE any tier-1 build option in a single `options` mapping
      whose keys are the declaration file''s own section names, so one vocabulary covers both
      routes and the build diagnostics name their findings in it. Values are inline for the list
      and small-mapping options and a path for the six manifest-shaped documents; a relative path
      resolves against the REPO ROOT, not the caller''s working directory. A stated value WINS
      over the target''s declaration, which wins over the built-in defaults. The surface fails
      closed at BOTH levels: an unknown section is refused by name against the accepted set, a
      correctly-spelled but DERIVED key is refused with the reason it cannot be stated rather than
      as unknown, and an entry whose value is out of vocabulary (an event role that is not
      producer/consumer) is refused rather than parsed into a mapping nothing reads. Validation
      completes before any assignment, so a mapping with one bad entry applies NOTHING. Omitting
      the argument, or passing an empty mapping, changes nothing and is not an error.'
    x-priority: P1
    x-status: implemented
    x-evidence: 'gh#332, and it is gh#319''s top tier finally reachable — that work built a
      five-tier precedence rule whose tier 1 no consumer could reach, which made tier 5 the
      ceiling rather than the floor. clew/buildoptions.py apply_options / accepted_options
      / BuildOptionError, wired through cli.build_index and mcp_server.server._run_build /
      build_or_refresh. `event_tags` is the key that proves the gap: it had NO CLI flag by an
      earlier deliberate decision, so before this the only way to state a bus vocabulary was to
      edit the target repo''s own tree. The entry-level gate exists because that level is the
      quiet one — CLAUDE.md records `key_arg_idx` for `key_arg_index` silently keying dataflow off
      argument 0. Paired with REQ-DDB-CONFIG-007: without the diagnostics an operator has a knob
      and no reason to turn it. tests/test_buildoptions.py.'
  REQ-DDB-PIPE-007:
    subsystem: pipeline
    name: CONFIG-gated source lines are harvested from preprocessor conditionals
    acceptance_criteria: The tree-sitter harvest records one `kconfig_gates` row per (symbol, form,
      file, line) for every `CONFIG_*` token appearing in a `#ifdef` / `#ifndef` / `#if` / `#elif`
      directive, distinguishing the three forms so `ifndef`'s inverted sense is not read as
      `ifdef` and an unevaluated expression claims no polarity. A runtime `if (IS_ENABLED(...))` is
      NOT a gate. Gates on symbols no Kconfig declares are KEPT — dead code behind a switch nobody
      can set is a finding. The table is created even at zero rows when tree-sitter is available
      and deliberately NOT created when it is absent, so an empty layer is distinguishable from an
      absent one.
    x-priority: P2
    x-status: implemented
    x-evidence: gh#18 part 3. clew/kconfig_gates.py _GateHarvester / _gates_from_node /
      _ifdef_form / import_kconfig_gates / ensure_kconfig_gates_table, its own extract_cache
      partition (STAGE_KCONFIG_GATES). tests/test_kconfig.py.
  REQ-DDB-PIPE-009:
    subsystem: pipeline
    name: An AST name fan-out is deleted where a stronger layer named the real callee
    acceptance_criteria: The `ast` / `ast_member` layers resolve a callee by NAME and emit one
      `fuzzy` edge per namesake. A stage below EVERY call-edge layer deletes such a row when the
      same (caller, bare callee name) group carries NON-FUZZY evidence naming a different
      qualified identity. Three exemptions, each of which the unexempted version got wrong — a
      group with no non-fuzzy anchor is untouched (so the rule is not "prefer non-fuzzy", which
      would empty a mostly-fuzzy C++ graph); a row whose identity IS an anchor is kept, because
      those rows ARE `corroborated_by`; and a doxygen `reimplements` override of an anchor is
      kept, because template-method dispatch reaches the derived override through no other edge.
      `fuzzy` rows from `declared_dispatch` / `fnptr` encode a deliberate multi-candidate dispatch
      and are out of scope. Identity is `query._common.qualified_name_of`, reused rather than
      re-derived, so pipeline deletions cannot drift from query identity and decl/def duality is
      safe. ONLY `fuzzy` rows are deleted, so liveness, termini and thread membership — all of
      which traverse non-fuzzy edges only — are provably unchanged. A `memberdef` without a
      `definition` column, or an index with no `call_edges` table, deletes nothing rather than
      raising.
    x-priority: P1
    x-status: implemented
    x-evidence: gh#26 residual. clew/dominated_edges.py — classify_dominated,
      prune_dominated_fuzzy_edges, prune_dominated_fuzzy_call_edges, _identity_index,
      _override_pairs, _anchors, _delete, _log_verdict; wired in cli.py below
      import_declared_dispatch_edges. Build version 27. Measured before landing — entropic 539 of
      5,614 fan-out fuzzy rows deleted, mbedtls 0 of 4, self-index 246 of 2,874; 8 groups totalling
      51 deleted rows hand-checked against source, all 51 fabrications.
      tests/test_dominated_edges.py.
  REQ-DDB-PIPE-010:
    subsystem: pipeline
    name: Shared-key fan-out is capped on edges produced, not on either side alone
    acceptance_criteria: A shared key is suppressed when `writers x readers` exceeds the edge
      ceiling — the count of edges it would actually contribute — rather than when either side
      alone exceeds a participant cap. The per-side test discarded the two LINEAR shapes with the
      most meaning per edge, a FUNNEL (many writers, one reader) and its dual a BROADCAST, while
      the O(n^2) noise blob it exists to stop requires both sides to be large. The ceiling equals
      the previous rule's maximum admission (8 x 8), so no key the old rule admitted is newly
      discarded, and a many-to-many key above it is still suppressed entirely. Every suppressed
      key is NAMED at INFO with its writer and reader counts, so a reader whose key returned
      nothing can learn it was suppressed without reading pipeline source.
    x-priority: P2
    x-status: implemented
    x-evidence: gh#28. clew/shared_key_edges.py — _MAX_KEY_EDGES, _build_inferred_edges,
      _log_suppressed_keys. Build version 27. Both public targets declare no accessor patterns, so
      their shared_key_edges layer is empty and the measured delta on entropic and mbedtls is zero;
      the shape recovery is pinned by fixtures. Replaces a test that ASSERTED the defect — 9
      writers x 1 reader yielding zero edges. tests/test_build_docs_db.py
      test_shared_key_funnel_key_survives_suppression /
      test_shared_key_broadcast_key_survives_suppression /
      test_shared_key_quadratic_fanout_key_still_suppressed /
      test_shared_key_at_the_edge_ceiling_is_admitted /
      test_shared_key_suppressed_key_is_named_in_the_log.
  REQ-DDB-QUERY-006:
    subsystem: query
    name: The configuration space is queryable, and an empty answer says why
    acceptance_criteria: The `kconfig_space` accessor returns the symbols with their choice-group identity and
      per-symbol gate counts, the gating sites (optionally narrowed to one symbol, accepted bare or
      CONFIG_-prefixed), and the provenance that distinguishes the THREE ways it can be empty — no
      Kconfig (`found` false), one found but unparseable (`found` true with `error`), or one that
      genuinely declares nothing. It reports the variant this index was built in beside the space,
      so a `default` cannot be read as a fact about the build.
    x-priority: P2
    x-status: implemented
    x-evidence: gh#18. clew/query/kconfig.py kconfig_space / _symbols / _gates / _meta;
      models KconfigEntry / KconfigGate / KconfigSpace; exposed over MCP as the `kconfig` tool
      (mcp_server/tools_query.py, descriptions/kconfig.json), returned through wire.one rather than
      the many-envelope so `found`/`error` survive. tests/test_kconfig.py, tests/test_mcp_server.py.
  REQ-DDB-SCHEMA-013:
    subsystem: schema
    name: Kconfig structure tables, created independently of the gating table
    acceptance_criteria: The `kconfig_symbols` table (with a vocabulary-generated CHECK on `type`) and
      `kconfig_choices` are created together and `kconfig_gates` (with a CHECK on `form`)
      separately, because the two layers fail independently — a repo can have a parseable Kconfig
      and no C sources, or gated C and an unparseable Kconfig — and a shared creator would make one
      layer's absence look like the other's.
    x-priority: P2
    x-status: implemented
    x-evidence: gh#18. clew/kconfig.py ensure_kconfig_tables and
      clew/kconfig_gates.py ensure_kconfig_gates_table; both CHECKs generated from
      vocabulary.KCONFIG_TYPE / KCONFIG_GATE_FORM and pinned in tests/data/schema_vocabulary.json.
      `choice_key` is deliberately NOT a foreign key — it is a synthetic per-build ordinal, and a
      REFERENCES would promise a stability across builds the enumeration order does not.
  REQ-DDB-PIPE-008:
    subsystem: pipeline
    name: File-level documentation is indexed as a searchable unit
    acceptance_criteria: Every indexed source file's module docstring (Python, read via the AST) or
      leading file-level DOXYGEN comment (C-family — `/**`, `/*!`, `///`, `//!` only, so a plain
      `/* Copyright */` header cannot enter the corpus) is stored as one `file_docs` row AND as one
      FTS5 `supplementary_docs` chunk. The stage reads the INDEXED file inventory rather than
      globbing the tree, so it cannot widen the build's scope decision. It runs AFTER
      `ingest_supplementary_docs` (which DROPs the FTS table) and AFTER `report_index_coverage`
      (which counts a file that yielded prose as not barren, so running earlier would improve the
      barren ratio with no extra symbol indexed). A file with no documentation, an unclaimed
      suffix, or non-UTF-8 bytes yields no row and does not fail the build.
    x-priority: P1
    x-status: implemented
    x-evidence: gh#10. clew/filedocs.py — FileDocExtractor base with PythonFileDoc /
      CFamilyFileDoc, extract_file_doc, ingest_file_docs, _collect_file_docs, _indexed_files,
      _read_text, ensure_file_docs_table; wired in cli.py below report_index_coverage. Build
      version 23. tests/test_filedocs.py.
  REQ-DDB-SCHEMA-014:
    subsystem: schema
    name: A file-level documentation table, absent on an older index rather than empty
    acceptance_criteria: The table `file_docs(file_path, doc)` holds one row per indexed file carrying
      file-level documentation. No enumerated column, so nothing is generated from vocabulary. The
      table's ABSENCE is meaningful and queryable — an index built before build 23 has no such
      table, and `query.has_file_docs` reports that so an empty search can say the corpus was
      absent instead of asserting a negative it had no way to check.
    x-priority: P2
    x-status: implemented
    x-evidence: gh#10. clew/filedocs.py ensure_file_docs_table; read by
      query/corpus.py file_doc_rows / has_file_docs. tests/test_filedocs.py.
  REQ-DDB-QUERY-007:
    subsystem: query
    name: An empty result is graded, and names the scope that produced it
    acceptance_criteria: An empty `search` or `list_files` reply states which corpora were searched,
      carries the indexed scope (source, reason, file count, covered top-level directories and
      extensions), and claims only the confidence it has earned. THREE cases are distinguished —
      a single token matching nothing anywhere keeps the full definitive wording; a `list_files`
      pattern whose extension appears in NO indexed file is definitive about the index with the
      reason stated, and explicitly not a claim about the working tree; a multi-token `search` miss
      is NOT definitive and reports per-token hit counts naming the token that emptied the
      conjunction. The per-token diagnosis is computed only on a zero result and only up to
      MAX_DIAGNOSED_TOKENS. The extension certainty is derived from the UNCAPPED extension list, so
      a truncated display list cannot manufacture a false negative. A CORPUS MISS NAMES ITS OWN
      BOUNDARY AND ROUTES ONWARD rather than asserting the index is exhausted — the files corpus
      holds indexed SOURCE files, so a build script or a Doxyfile is absent there by construction,
      and its miss note says so and names `doc_scope` and the directory inventory — both of which
