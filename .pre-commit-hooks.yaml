## The doxygen gate, absorbed from the separate doxygen-guard project into clew/guard/. The ID is
## `clew-guard`: the tool is one repository now and the hook name says so. An adopting repo
## pinning the old `doxygen-guard` id must rename it, which is a deliberate break — the owner's
## call, on the grounds that the user base is small and one tool beats two.
## Its config is the `guard:` section of the repo's `.clew.yaml`; `args: [--config, <file>]`
## points it at a different file of the same shape.
- id: clew-guard
  name: clew guard
  description: Validate doxygen comments for presence, version staleness, and custom tag syntax
  entry: clew-guard
  language: python
  types_or: [c, c++, python, rust, javascript, jsx, ts, tsx]
  require_serial: true

## The wiki's static check (1.4.0, #67): every key of the `wiki:` section known, everything it
## points at present — flows, reports, the catalog's pins, theme files. `--refresh` brings the
## index current first (fast tier when it can), so the hook works in a fresh checkout. Sphinx is
## not needed; `clew wiki build` is a separate CI stage.
- id: clew-wiki-check
  name: clew wiki check
  description: Validate the wiki section of .clew.yaml against the repository and its index
  entry: clew wiki check --refresh
  language: python
  pass_filenames: false
  always_run: true
  require_serial: true
