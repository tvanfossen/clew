# clew's own declaration file. clew adopts its own tools in full (round 3, P6c):
#
#   guard:  what `clew guard` enforces on every commit — presence, @version bumps, @req ids that
#           exist in requirements.yaml, `satisfies` links that resolve — and the change-impact
#           report (docs/generated/impact/impact.json) the wiki's Change impact page reads.
#   wiki:   clew's own wiki — docs labelled by kind, the MCP tool handlers as flows, requirement
#           tiers from the gate's own JUnit (build/junit.xml) and CI's coverage (build/coverage.xml).
#           `clew wiki check` runs in pre-commit; CI builds the site (Pages deploys at 2.0.0).
#
# The index declares no scope and builds this repo on its defaults.
#
# Every function/class in the shipped Python package carries:
#   ## @brief    one-line summary
#   ## @version  bumped on body change
#   ## @return   on non-void functions
#
# Measured figures live in the wiki (its Requirements page counts implemented, tested and
# passing requirements from the index and the reports), not in this header: a figure written
# here goes stale the commit after it is measured, as the coverage figure it once quoted did.

guard:
  output_dir: docs/generated/

  # Declare where our catalog lives, so the INDEX finds it without a CLI flag.
  # Not cosmetic dogfooding: `bd2d34e` taught clew to honour this field
  # precisely because a repo that declares its catalog had the declaration read by
  # the gate and ignored by the index — and we then shipped that fix without
  # applying it to ourselves. A bare `--scope from-guard` build of this repo
  # ingested ZERO catalog rows, so `req_trace` returned implementers with no title,
  # status or acceptance, and the "30 of 34" figure was reproducible only with an
  # undocumented `--requirements` argument. Through the MCP server, which passes no
  # flags, it could not be reproduced at all.
  impact:
    requirements:
      file: requirements.yaml
    # round 3, P6c: the `clew-guard-impact` hook writes the report the wiki's Change impact page
    # reads. JSON at the path the wiki looks for by default; gitignored, never committed.
    output:
      format: json
      file: docs/generated/impact/impact.json

  validate:
    exclude:
      - "^\\.venv/"
      - "^\\.claude/"
      - "^workspace/"
      - "^tests/"           # tests are exempt (fixtures, asserts)
      - "^scripts/"         # dev helpers
      - "^acceptance/"      # benchmark harness + evidence, not shipped code
      - "^docs/generated/"
    # NOTE: this key was DUPLICATED — an empty `tags:` sat directly above the real
    # one. YAML takes the last, so the real block won and nothing broke, which is
    # why it survived. The trap is that a reorder or an insertion between them
    # would silently hand the win to the empty mapping, dropping the declared @req
    # id pattern and disabling tag validation with no error anywhere.
    tags:
      # clew's own requirement id shape. Declared so @req tags validate
      # against it — NOT hardcoded anywhere in the pipeline.
      #
      # A BARE ID, nothing else. This pattern used to carry an optional
      # `( \[inferred\])?` suffix, because the project had a convention where a tag
      # could mark its own mapping as inferred rather than asserted, and
      # doxygen-guard validates the WHOLE remainder of the `@req` line rather than
      # just the first token.
      #
      # The convention was RETIRED 2026-07-30 by the owner: "I would rather not put
      # requirements as inferred or not — they should simply be the stated ID,
      # inferred is noise." The marker is gone from the tags, the parser and the
      # schema — `req_edges.confidence` no longer exists, because a column that can
      # hold only one value states nothing.
      req:
        pattern: "^REQ-DDB-[A-Z]+-[0-9]{3}$"

# clew's own wiki (round 3, P6): clew documents itself with the site it generates. Human guides
# are grouped by kind; the agent-facing documents (AGENTS.md, SKILLS.md) are kept apart. The MCP
# tool handlers are declared as product flows, so the site shows what a `dossier` call does.
wiki:
  title: clew
  docs: [README.md, SKILLS.md, AGENTS.md, SECURITY.md, "docs/*.md"]
  doc_kinds:
    README.md: tutorial
    docs/WIKI.md: howto
    docs/GUARD.md: howto
    docs/OVERVIEW.md: explanation
    docs/CORE_HYPOTHESIS.md: explanation
    docs/DESIGN.md: explanation
    SECURITY.md: reference
    docs/SECURITY.md: reference
    AGENTS.md: agents
    SKILLS.md: agents
  flows:
    - entry: dossier
      file: clew/mcp_server/tools_query.py
      depth: 2
      lanes: packages
      title: "MCP `dossier`: one subject, every layer"
    - entry: search
      file: clew/mcp_server/tools_query.py
      depth: 2
      lanes: packages
      title: "MCP `search`: find the name"
    - entry: index
      file: clew/mcp_server/server.py
      depth: 2
      lanes: packages
      title: "MCP `index`: refresh, status, targets"
    - entry: build_wiki
      depth: 2
      lanes: packages
      title: "build_wiki: how this site is built"
  tooling: ["scripts/*", "acceptance/*", "tools/*"]
  # The gate's own run is the evidence: scripts/run_tests.py writes JUnit on every run, and CI's
  # wiki job adds Cobertura (`run_tests.py --coverage`).
  tests:
    junit: [build/junit.xml]
    coverage: build/coverage.xml
  issues: {github: tvanfossen/clew}
  links:
    template: "https://github.com/tvanfossen/clew/blob/{commit}/{file}#L{line}"
