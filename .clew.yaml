# clew's own declaration file. clew adopts its own tools in full (round 3, P6c):
#
#   guard:  what `clew guard` enforces on every commit — presence, @version bumps, @req ids that
#           exist in requirements.yaml, `satisfies` links that resolve — and the change-impact
#           report (guard.impact.report_dir) the wiki's Change impact page reads.
#   wiki:   clew's own wiki — docs labelled by kind, the MCP tool handlers as flows, requirement
#           tiers from the gate's own JUnit (build/junit.xml) and CI's coverage (build/coverage.xml).
#           `clew wiki check` runs in pre-commit; CI builds the site (Pages deploys at 2.0.0).
#
# The index declares no scope and builds this repo on its defaults.
#
# Every function/class in the shipped Python package carries:
#   ## @brief    one-line summary
#   ## @version  bumped on body change
#   ## @return   on non-void functions
#
# Measured figures live in the wiki (its Requirements page counts implemented, tested and
# passing requirements from the index and the reports), not in this header: a figure written
# here goes stale the commit after it is measured, as the coverage figure it once quoted did.

# The requirements catalog — ONE section the index, the gate and the wiki all read (2.0.0).
# Not cosmetic dogfooding: `bd2d34e` taught clew to honour a declared catalog precisely because a
# repo that declared one had it read by the gate and ignored by the index — and we then shipped
# that fix without applying it to ourselves. A bare build of this repo ingested ZERO catalog rows,
# so `req_trace` returned implementers with no title, status or acceptance.
requirements:
  file: requirements.yaml
  # round 3, P6c: `clew guard coverage` (a pre-commit hook) fails when a catalogued requirement
  # has no @req implementer, unless its status exempts it — unbuilt (`planned`) or satisfied by
  # configuration files rather than a function (`configuration`). Exemptions are listed in every
  # coverage report by id and status, never silently.
  status_field: x-status
  exempt_status: [planned, configuration]

guard:
  # round 3, P6c: the `clew-guard-impact` hook (`clew guard impact --write`) writes impact.md and
  # impact.json here, which is where the wiki's Change impact page reads it. Gitignored.
  impact:
    report_dir: docs/generated/impact/

  validate:
    exclude:
      - "^\\.venv/"
      - "^\\.claude/"
      - "^workspace/"
      - "^tests/"           # tests are exempt (fixtures, asserts)
      - "^scripts/"         # dev helpers
      - "^acceptance/"      # benchmark harness + evidence, not shipped code
      - "^docs/generated/"
    # NOTE: this key was DUPLICATED — an empty `tags:` sat directly above the real
    # one. YAML takes the last, so the real block won and nothing broke, which is
    # why it survived. The trap is that a reorder or an insertion between them
    # would silently hand the win to the empty mapping, dropping the declared @req
    # id pattern and disabling tag validation with no error anywhere.
    tags:
      # clew's own requirement id shape. Declared so @req tags validate
      # against it — NOT hardcoded anywhere in the pipeline.
      #
      # A BARE ID, nothing else. This pattern used to carry an optional
      # `( \[inferred\])?` suffix, because the project had a convention where a tag
      # could mark its own mapping as inferred rather than asserted, and
      # doxygen-guard validates the WHOLE remainder of the `@req` line rather than
      # just the first token.
      #
      # The convention was RETIRED 2026-07-30 by the owner: "I would rather not put
      # requirements as inferred or not — they should simply be the stated ID,
      # inferred is noise." The marker is gone from the tags, the parser and the
      # schema — `req_edges.confidence` no longer exists, because a column that can
      # hold only one value states nothing.
      req:
        pattern: "^REQ-DDB-[A-Z]+-[0-9]{3}$"

# clew's own wiki (round 3, P6): clew documents itself with the site it generates. Human guides
# are grouped by kind; the agent-facing documents (AGENTS.md, SKILLS.md) are kept apart. The MCP
# tool handlers are declared as product flows, so the site shows what a `dossier` call does.
wiki:
  title: clew
  ## Round 4, R1: the map's blocks are what clew DOES, not its directories. Declared blocks win; a
  ## file named by none joins the block it shares the most calls with, labelled as inferred.
  components:
    "Answer: query engine + MCP server": ["clew/query/*", "clew/mcp_server/*", "clew/wire.py",
      "clew/query_command.py", "clew/export_command.py", "clew/mcp_config.py"]
    "Build: orchestration": ["clew/cli.py", "clew/harvest.py", "clew/harvest_plan.py",
      "clew/fasttier*.py", "clew/indexcache.py", "clew/build*.py", "clew/refresh_command.py",
      "clew/init_command.py", "clew/cull_command.py", "clew/scope.py", "clew/treescan.py",
      "clew/signature.py", "clew/stagetimer.py", "clew/declaration.py", "clew/config_defaults.py",
      "clew/toolchain.py", "clew/languages.py", "clew/filetypes.py", "clew/gitenv.py",
      "clew/diagnostics.py", "clew/errors.py", "clew/_common.py", "clew/vocabulary.py",
      "clew/tiers.py", "clew/tomlcompat.py", "clew/__main__.py"]
    "Build: parse front ends": ["clew/ast_symbols.py", "clew/pyast.py", "clew/jsast.py",
      "clew/shast.py", "clew/cmakeast.py", "clew/scriptast.py", "clew/substrate.py",
      "clew/tsnode.py", "clew/synth.py", "clew/doxygen*.py", "clew/c_extent.py",
      "clew/preprocessor.py", "clew/pydocs.py", "clew/rustdoc.py", "clew/py_entrypoints.py",
      "clew/external.py", "clew/datamodel.py", "clew/generated.py", "clew/enrichment.py"]
    "Build: call and data edges": ["clew/call_edges.py", "clew/dispatch*.py",
      "clew/callback_edges.py", "clew/event_edges.py", "clew/shared_key_edges.py",
      "clew/macro_refs.py", "clew/dominated_edges.py", "clew/reachability.py"]
    "Build: concurrency and config layers": ["clew/threads.py", "clew/locks.py",
      "clew/blocking.py", "clew/isr.py", "clew/critical_sections.py", "clew/context.py",
      "clew/kconfig*.py"]
    "Build: docs, requirements and tests layers": ["clew/filedocs.py", "clew/prose.py",
      "clew/code_text.py", "clew/req_mentions.py", "clew/requirements.py", "clew/coverage.py",
      "clew/testscope.py", "clew/guardconfig.py"]
    "Guard: the pre-commit gate": ["clew/guard/*"]
    "Wiki: this site": ["clew/wiki/*"]
    "Propose: declaration proposals": ["clew/propose/*"]
    "Acceptance: measuring clew": ["acceptance/*"]
    "Tooling: scripts": ["scripts/*"]
  docs: [README.md, SKILLS.md, AGENTS.md, SECURITY.md, "docs/*.md"]
  doc_kinds:
    README.md: tutorial
    docs/WIKI.md: howto
    docs/GUARD.md: howto
    docs/OVERVIEW.md: explanation
    docs/CORE_HYPOTHESIS.md: explanation
    docs/DESIGN.md: explanation
    SECURITY.md: reference
    docs/SECURITY.md: reference
    AGENTS.md: agents
    SKILLS.md: agents
  flows:
    - entry: dossier
      file: clew/mcp_server/tools_query.py
      depth: 2
      lanes: packages
      title: "MCP `dossier`: one subject, every layer"
    - entry: search
      file: clew/mcp_server/tools_query.py
      depth: 2
      lanes: packages
      title: "MCP `search`: find the name"
    - entry: index
      file: clew/mcp_server/server.py
      depth: 2
      lanes: packages
      title: "MCP `index`: refresh, status, targets"
    - entry: build_wiki
      depth: 2
      lanes: packages
      title: "build_wiki: how this site is built"
  tooling: ["scripts/*", "acceptance/*", "tools/*"]
  # The gate's own run is the evidence: scripts/run_tests.py writes JUnit on every run, and CI's
  # wiki job adds Cobertura (`run_tests.py --coverage`).
  tests:
    junit: [build/junit.xml]
    coverage: build/coverage.xml
    contexts: .coverage   # coverage.py's data file with per-test contexts: measured links
  issues: {github: tvanfossen/clew}
  links:
    template: "https://github.com/tvanfossen/clew/blob/{commit}/{file}#L{line}"
