# SPDX-License-Identifier: MIT
#
# THE GRADING KEY, AS DATA.
#
# A mark's `symbols` and `refs` are DECLARED here rather than guessed from its prose. The
# markdown reader inferred them with regexes, so a mark's punctuation decided whether it
# was machine-checkable: a whole-file citation extracted nothing and went to the LLM judge
# (Q1 #6 scored MISS with quote NONE while the answer named the file), and a junk token
# awarded a mark unseen (`mbedtls_`, `private_`, `global_data`).
#
# `refs` entries are [file], [file, line] or [file, lo, hi]. A bare [file] is a whole-file
# citation, which the markdown reader could not express at all.
#
# NO COUNTS ARE WRITTEN. `marks` and `graded_marks` are the list's length and the fence
# arithmetic; every written count in this rubric's history has been wrong at some point.
target: Mbed-TLS/mbedtls
commit: 068ff080b369adfac81509f9b57b2afabaf82dc5
target_ref: mbedtls-3.6.7
version: 1.0.0
ground_truth_source: MBEDTLS SOURCE at the commit above, read with git grep and git ls-files.

questions:
