# SPDX-License-Identifier: MIT
#
# THE GRADING KEY, AS DATA. Schema and rules: acceptance/DESIGN.md.
#
# Every mark below was verified by reading mbedtls source at the pinned commit. A mark is an
# ANSWER COMPONENT — what a complete answer to the question contains — not an artifact that some
# tool happens to surface. That cuts both ways: a component does not earn a mark because the
# index has a layer for it, and it does not earn one because a grep found it.

schema: 1

target: Mbed-TLS/mbedtls
commit: 068ff080b369adfac81509f9b57b2afabaf82dc5
ref: mbedtls-3.6.7
version: 3.0.1

ground_truth: |
  mbedtls source at the commit above, read directly. Every count and line number was taken from
  a working tree at that commit with no modifications.

judge:
  model: claude-sonnet-4-5-20250929
  samples_when_weight_at_least: 2

index:
  declare:
    preprocessor:
      predefined: [MBEDTLS_THREADING_C, MBEDTLS_THREADING_PTHREAD]
  variant_note: |
    THE INDEX UNDER TEST IS BUILT WITH BOTH THREADING MACROS DEFINED — the inverse of what
    mbedtls ships. That is deliberate: with them undefined the preprocessor never reaches the
    threaded code and the guarded functions are invisible to the index, so the build would
    differ from the source in a way that makes the target uninterestingly small.

    Q1 asks what the SHIPPED default does, and its answer is the opposite of what the index was
    built with. That is stated here so a reader knows the divergence is intended rather than a
    contamination, and so nobody later reads a Q1 result as evidence about the build.

    Q3 INHERITS THE SAME DIVERGENCE ONE LAYER DOWN. memory_buffer_alloc.c picks its installed
    allocator pair with `#if defined(MBEDTLS_THREADING_C)`, so the index built here sees the
    MUTEXED call site and not the plain one, while the shipped default is the reverse. The Q3
    mark asks for both branches and the contrast between them, which is readable from source
    either way; it is recorded here because the index arm gets half of that contrast handed to
    it and the other half not at all.

questions:
  - id: Q1
    intent: |
      Probes whether the agent stops at "there are threads and mutexes" — which is a ctrl-F away
      and which both arms reach in one step — or continues to "nothing runs concurrently as
      shipped". The recorded failure on the previous rubric generation was exactly that stop:
      answers named the spawn site and the entry function, and concluded mbedtls is threaded.
      The surface rung is worth 1 point and the conclusion rungs are worth 3, so an answer that
      stops early scores badly however much detail it gives about the site it did find.

    prompt: |
      mbedtls ships mutex and thread code. As the library is configured by default, what
      actually runs concurrently, and what protects what?

    marks:
      - text: names MBEDTLS_THREADING_C and MBEDTLS_THREADING_PTHREAD as the gating macros
        type: retrieval
        weight: 1
        evidence: |
          Declared in include/mbedtls/mbedtls_config.h. Both are the config-level switches for
          the whole threading layer.
        refs:
          - ["include/mbedtls/mbedtls_config.h", 2188, 2196]
          - ["include/mbedtls/mbedtls_config.h", 3740, 3787]

      - text: >-
          states that both threading macros are commented out in the shipped mbedtls_config.h,
          so a default build defines neither
        type: conclusion
        weight: 3
        evidence: |
          Line 2196 is `//#define MBEDTLS_THREADING_PTHREAD` and line 3787 is
          `//#define MBEDTLS_THREADING_C`. Both commented, verified at the pinned commit.
        refs:
          - ["include/mbedtls/mbedtls_config.h", 2196]
          - ["include/mbedtls/mbedtls_config.h", 3787]

      - text: >-
          concludes that a default build of mbedtls creates no threads at all, and that the
          pthread example compiles to a stub main under that condition
        type: conclusion
        weight: 3
        evidence: |
          programs/ssl/ssl_pthread_server.c:24 is
          `#elif !defined(MBEDTLS_THREADING_C) || !defined(MBEDTLS_THREADING_PTHREAD)`, whose
          body is a main() that prints "MBEDTLS_THREADING_PTHREAD not defined." and exits. The
          threaded body begins at the `#else` on line 30.
        refs:
          - ["programs/ssl/ssl_pthread_server.c", 24, 30]

      - text: >-
          states BOTH halves of the contrast: that nothing in library/ creates a thread, AND that
          library/ nonetheless supplies the mutex abstraction used by threaded callers
        type: conclusion
        weight: 3
        evidence: |
          Both creation sites are under programs/. library/threading.c supplies the mutex layer
          but spawns nothing itself.

          SHARPENED after a discrimination check. The mark previously read "places every
          thread-creation site outside library/", and a deliberately shallow answer that named
          ONE site and mentioned library/threading.c in passing was ruled HIT — it never
          established "every", but the judge could read the claim as implied. A mark satisfiable
          by a weaker claim than it states is a mark that measures nothing. Requiring both halves
          of the contrast cannot be satisfied by mentioning one site, and the completeness of the
          site list is measured by the set mark below where it belongs.
        refs:
          - ["programs/ssl/ssl_pthread_server.c", 277]
          - ["programs/test/benchmark.c", 430]

      - text: every source file containing a thread-creation site
        type: set
        weight: 2
        extract: |
          List every file path the answer names as containing a site where a thread is created.
          Paths only, one per line, exactly as the answer writes them. If the answer names none,
          reply NONE.
        members:
          - value: programs/ssl/ssl_pthread_server.c
            evidence: "pthread_create at :277, entry handle_ssl_connection (:98)"
          - value: programs/test/benchmark.c
            evidence: "_beginthread(TimerProc, 0, NULL) at :430; TimerProc at :410"

      - text: >-
          identifies the benchmark timer thread as Windows-only, gated on a platform condition
          rather than on the threading config
        type: conclusion
        weight: 2
        evidence: |
          programs/test/benchmark.c:430 uses _beginthread, a Windows CRT call. It is gated by a
          platform condition, NOT by MBEDTLS_THREADING_*. An answer that says "no threads,
          because the threading macros are off" has the right conclusion by an incomplete
          argument — this mark is what separates the two.
        refs:
          - ["programs/test/benchmark.c", 410, 430]

      - text: >-
          identifies debug_mutex as serialising debug output so that concurrent connections do
          not interleave their logging
        type: conclusion
        weight: 2
        evidence: |
          Declared programs/ssl/ssl_pthread_server.c:65; locked :73 and unlocked :80 around the
          debug callback body; init :321; free :483.
        refs:
          - ["programs/ssl/ssl_pthread_server.c", 65]
          - ["programs/ssl/ssl_pthread_server.c", 73, 80]

  - id: Q2
    intent: |
      Probes the difference between naming a macro and explaining what it does to a consumer.
      The surface fact — MBEDTLS_PRIVATE exists — is one lookup, and the DIRECTION of the default
      needs the two-branch body read rather than a name resolved.

      EXTENDED after n=1 tied at 80%/80%. The original question was answerable almost entirely
      from one header. The addition asks WHERE THE OPT-OUT IS ACTUALLY TURNED ON, which is
      nowhere near the macro: one line in a header every library translation unit includes, plus
      two example programs that deliberately reach past the API they demonstrate.

      RE-MEASURED 2026-08-22 ON THE EXTENDED QUESTION, and the tie is gone in the direction
      nobody predicted: baseline 87.9%, index 69.7%, both at 0.0% unmarked. The earlier reading
      of this cell was taken when the judge returned NOTHING for either arm — 100% unmarked
      against both — so "tied at 80/80" describes the pre-extension question graded by a judge
      that was failing every call. Both halves of that sentence are now superseded.

      Whether the extension is what moved it cannot be told apart from the judge fix at n=1.
      Recorded so the weekend grid is read against this number and not the withdrawn one.

    prompt: |
      mbedtls wraps struct members in MBEDTLS_PRIVATE. What does that accomplish, and for whom?

      Be concrete about the "for whom": find where the opt-out is actually turned on in this
      tree, and say what that means for the code in those places.

    marks:
      - text: locates the macro's definition in include/mbedtls/private_access.h
        type: retrieval
        weight: 1
        evidence: |
          The whole definition is a single #ifndef/#else/#endif in that header.
        refs:
          - ["include/mbedtls/private_access.h", 14, 18]

      - text: >-
          states that by default the macro RENAMES the member to private_<member>, and that
          defining MBEDTLS_ALLOW_PRIVATE_ACCESS makes it expand to the member name unchanged
        type: conclusion
        weight: 3
        evidence: |
          #ifndef MBEDTLS_ALLOW_PRIVATE_ACCESS -> `private_##member`; #else -> `member`. The
          DEFAULT branch is the renaming one, which is the direction an answer most often gets
          backwards.
        refs:
          - ["include/mbedtls/private_access.h", 14, 18]

      - text: >-
          explains that the two branches give different consumers different views — code that
          defines MBEDTLS_ALLOW_PRIVATE_ACCESS sees plain member names while an ordinary
          consumer of the public headers sees the renamed ones
        type: conclusion
        weight: 3
        evidence: |
          The single macro serves both audiences from one header; which expansion you get is
          decided entirely by whether you defined the opt-in before including it.
        refs:
          - ["include/mbedtls/private_access.h", 14, 18]

      - text: >-
          concludes that this enforces API opacity at COMPILE time by breaking the member name,
          rather than by hiding the struct layout — the fields remain visible and sized
        type: conclusion
        weight: 3
        evidence: |
          The macro only rewrites the identifier. The struct stays fully defined in the public
          header, so its layout and size are unchanged and it remains stack-allocatable; what
          breaks is source that names a member directly.
        refs:
          - ["include/mbedtls/private_access.h", 14, 18]

      - text: >-
          conveys that the macro is applied at a scale of many hundreds of sites, overwhelmingly
          in the public headers rather than in library implementation
        type: conclusion
        weight: 2
        evidence: |
          875 occurrences of `MBEDTLS_PRIVATE(` across .h and .c at the pinned commit, spread
          over 66 files: 59 under include/, 5 under library/, 2 under programs/. An answer
          conveying the right order of magnitude and the right skew earns this; an exact count
          is not required and must not be, since it is an artifact of how one counts.
        refs:
          - ["include/mbedtls/private_access.h", 14, 18]

      - text: >-
          states that library-internal code turns the opt-out ON in a shared header, so every
          library translation unit sees plain member names
        type: conclusion
        weight: 3
        evidence: |
          library/common.h:132 defines MBEDTLS_ALLOW_PRIVATE_ACCESS, with a docstring saying
          "Allow library to access its structs' private members". Every library .c includes it,
          so the whole library compiles against the unrenamed form while an external consumer of
          the same headers does not.
        refs: [["library/common.h", 126, 132]]

      - text: >-
          identifies that some example programs ALSO define the opt-out for themselves,
          deliberately reaching past the public API they otherwise demonstrate
        type: conclusion
        weight: 2
        evidence: |
          programs/ssl/ssl_client2.c:8 and programs/ssl/ssl_server2.c:8 each define
          MBEDTLS_ALLOW_PRIVATE_ACCESS before including anything.
        refs:
          - ["programs/ssl/ssl_client2.c", 8]
          - ["programs/ssl/ssl_server2.c", 8]

      - text: every file that turns the private-access opt-out on
        type: set
        weight: 2
        extract: |
          List every file the answer says DEFINES the macro that disables the private-member
          renaming (that is, files that turn the opt-out on — not files that merely mention or
          test it). Paths only, one per line, as the answer writes them. If none, reply NONE.
        members:
          - value: library/common.h
            evidence: ":132, for the whole library"
          - value: programs/ssl/ssl_client2.c
            evidence: ":8"
          - value: programs/ssl/ssl_server2.c
            evidence: ":8"

      - text: the top-level directories where MBEDTLS_PRIVATE is used
        type: set
        weight: 2
        extract: |
          List every top-level directory the answer says contains uses of MBEDTLS_PRIVATE. One
          per line, bare directory names as the answer writes them. If the answer names none,
          reply NONE.
        members:
          - value: include
            evidence: "59 files"
          - value: library
            evidence: "5 files"
          - value: programs
            evidence: "2 files"

  - id: Q3
    intent: |
      INDIRECT DISPATCH. Q1 and Q2 both resolve to a config macro; this one resolves to a pair of
      function POINTERS whose value is set by a different module at runtime, and whose existence
      is decided at compile time by a third path. The complete answer needs four files that do
      not reference each other in any single direction: the header that declares (or does not
      declare) the setter, the .c that holds the pointers, the only in-tree caller of the setter,
      and the config that gates all of it.

      The trap is stopping at "mbedtls_calloc is a function pointer you can replace". That is
      true in exactly one of the three configurations and false in the default one, where
      mbedtls_calloc is a plain macro to libc calloc with no indirection to replace.

    prompt: |
      When mbedtls allocates memory, what actually gets called? Explain how a project would
      substitute its own allocator, and what the library itself does with that facility.

    marks:
      - text: >-
          states that MBEDTLS_PLATFORM_MEMORY is the gate, and that it is commented out in the
          shipped mbedtls_config.h
        type: retrieval
        weight: 1
        evidence: |
          include/mbedtls/mbedtls_config.h:208 is `//#define MBEDTLS_PLATFORM_MEMORY`.
        refs:
          - ["include/mbedtls/mbedtls_config.h", 208]

      - text: >-
          concludes that in a DEFAULT build there is no indirection at all — mbedtls_calloc and
          mbedtls_free are preprocessor macros expanding directly to calloc and free
        type: conclusion
        weight: 3
        evidence: |
          include/mbedtls/platform.h:165-168 is the `#else /* !MBEDTLS_PLATFORM_MEMORY */` branch:
          it #undefs the names and defines them to `free` and `calloc`. This is the direction most
          often gotten backwards — an answer that has read only platform.c sees function pointers
          and reports them as the normal case.
        refs:
          - ["include/mbedtls/platform.h", 138, 171]
          - ["include/mbedtls/platform.h", 165, 168]

      - text: >-
          distinguishes the two ways to substitute an allocator — a COMPILE-time pair of macros
          versus a RUNTIME pair of function pointers — and states that they are mutually exclusive
        type: conclusion
        weight: 3
        evidence: |
          platform.h:139-146: with both MBEDTLS_PLATFORM_CALLOC_MACRO and
          MBEDTLS_PLATFORM_FREE_MACRO defined, the names expand to those macros and no pointers
          exist. Only the `#else` at :147 declares the extern functions and the setter.
        refs:
          - ["include/mbedtls/platform.h", 139, 162]

      - text: >-
          states that on the macro path mbedtls_platform_set_calloc_free does not exist at all —
          it is neither declared nor compiled, rather than being present and ignored
        type: conclusion
        weight: 3
        evidence: |
          The declaration at platform.h:160 sits inside the `#else` branch, and library/platform.c
          wraps the whole runtime block in
          `#if defined(MBEDTLS_PLATFORM_MEMORY) && !(CALLOC_MACRO && FREE_MACRO)` at :20-22. The
          comment there states the compile-time configuration "takes precedence".

          This is the mark that separates an answer describing the mechanism from one that has
          established which mechanism a given build actually has.
        refs:
          - ["include/mbedtls/platform.h", 158, 162]
          - ["library/platform.c", 18, 22]

      - text: >-
          identifies that the pointers' defaults FAIL rather than fall back — an uninitialised
          calloc returns NULL and an uninitialised free does nothing
        type: conclusion
        weight: 2
        evidence: |
          library/platform.c:25-31 platform_calloc_uninit returns NULL; :36-39 platform_free_uninit
          is a no-op; :44-45 install them as the initial values of mbedtls_calloc_func and
          mbedtls_free_func when MBEDTLS_PLATFORM_STD_CALLOC/_FREE are not supplied.
        refs:
          - ["library/platform.c", 24, 45]

      - text: >-
          identifies the buffer allocator (MBEDTLS_MEMORY_BUFFER_ALLOC_C) as the only in-tree
          user of the runtime setter, installing itself over the pointers from its init function
        type: conclusion
        weight: 3
        evidence: |
          library/memory_buffer_alloc.c:566-576. mbedtls_memory_buffer_alloc_init calls
          mbedtls_platform_set_calloc_free. It is the only call site of that function in the
          library at the pinned commit; every other occurrence in the tree is documentation or a
          declaration.

          This is the cross-file half of the question: nothing in platform.h or platform.c points
          at memory_buffer_alloc.c, and nothing in the config entry for MBEDTLS_PLATFORM_MEMORY
          names it either.
        refs:
          - ["library/memory_buffer_alloc.c", 566, 576]

      - text: >-
          states that the buffer allocator installs a MUTEXED pair when MBEDTLS_THREADING_C is on
          and a plain pair otherwise, chosen at compile time inside its init function
        type: conclusion
        weight: 2
        evidence: |
          memory_buffer_alloc.c:569-576 is a `#if defined(MBEDTLS_THREADING_C)` selecting
          buffer_alloc_calloc_mutexed/buffer_alloc_free_mutexed (defined :541-563, each taking
          heap.mutex) over buffer_alloc_calloc/buffer_alloc_free.
        refs:
          - ["library/memory_buffer_alloc.c", 541, 576]

      - text: >-
          states that the buffer allocator itself requires MBEDTLS_PLATFORM_MEMORY, so enabling it
          alone is not enough to route the library's allocations through it
        type: conclusion
        weight: 2
        evidence: |
          mbedtls_config.h:3071-3072 lists `Requires: MBEDTLS_PLATFORM_C` and
          `MBEDTLS_PLATFORM_MEMORY (to use it within Mbed TLS)`; include/mbedtls/check_config.h:426
          turns the missing prerequisite into a #error.
        refs:
          - ["include/mbedtls/mbedtls_config.h", 3062, 3076]
          - ["include/mbedtls/check_config.h", 426, 429]

      - text: the files that participate in choosing what mbedtls_calloc resolves to
        type: set
        weight: 2
        extract: |
          List every file path the answer names as taking part in deciding what mbedtls_calloc
          resolves to, or in supplying a replacement for it. Paths only, one per line, exactly as
          the answer writes them. If the answer names none, reply NONE.
        members:
          - value: include/mbedtls/platform.h
            evidence: ":138-171, the three-way #if that decides the name's expansion"
          - value: library/platform.c
            evidence: ":20-63, the pointers, their failing defaults and the setter"
          - value: library/memory_buffer_alloc.c
            evidence: ":566-576, the only in-tree caller of the setter"
          - value: include/mbedtls/mbedtls_config.h
            evidence: ":208 MBEDTLS_PLATFORM_MEMORY, :3076 MBEDTLS_MEMORY_BUFFER_ALLOC_C"

  - id: Q4
    intent: |
      BUILD PROVENANCE. The question looks like a straightforward "how do error strings work",
      and its surface is answerable from one header. What is not in any single file is that
      library/error.c IS GENERATED — the file carries no banner saying so, so an answer that
      reads it top to bottom will describe a hand-written lookup table and be wrong about where
      a new error string comes from.

      Deliberately inverted against Q1 and Q3: here the feature is ON by default, so "check
      whether it is enabled" — a habit those questions reward — produces a different answer.

    prompt: |
      A caller gets back a negative integer from an mbedtls function. Walk through how that
      becomes a human-readable string, and say what a contributor has to do to add a new one.

    marks:
      - text: >-
          names mbedtls_strerror as the entry point and locates it in library/error.c
        type: retrieval
        weight: 1
        evidence: |
          Declared include/mbedtls/error.h:165; the MBEDTLS_ERROR_C definition is
          library/error.c:792.
        refs:
          - ["include/mbedtls/error.h", 165]
          - ["library/error.c", 792]

      - text: >-
          explains that a code carries TWO layers — a high-level module part and a low-level part
          — and that mbedtls_strerror renders both, joined, when both are present
        type: conclusion
        weight: 3
        evidence: |
          error.h:26-32 gives the bit segmentation: 1 sign bit, 3 bits high-level module id,
          5 bits module-dependent code, 7 bits low-level. library/error.c:792 onward calls
          mbedtls_high_level_strerr then mbedtls_low_level_strerr and separates them with " : ".
        refs:
          - ["include/mbedtls/error.h", 20, 40]
          - ["library/error.c", 792, 861]

      - text: >-
          concludes that library/error.c is GENERATED from the public headers by
          scripts/generate_errors.pl using scripts/data_files/error.fmt as its template
        type: conclusion
        weight: 3
        evidence: |
          library/Makefile:355-358 and library/CMakeLists.txt:130-147 both build error.c by
          running scripts/generate_errors.pl over include/mbedtls/*.h plus
          scripts/data_files/error.fmt.

          THE FILE ITSELF SAYS NOTHING. There is no "automatically generated" banner and no
          "DO NOT EDIT" line anywhere in library/error.c at the pinned commit — verified by
          searching for both. So this fact is reachable only from the build system or from the
          script, never from the file an answer is most likely to read.
        refs:
          - ["library/Makefile", 355, 358]
          - ["library/CMakeLists.txt", 130, 147]

      - text: >-
          concludes that adding a new error string means adding the /** */-documented #define to
          the module's public header and re-running the generator, NOT editing library/error.c
        type: conclusion
        weight: 3
        evidence: |
          Direct consequence of the generation step: the generator's inputs are the headers, so
          an edit to error.c is overwritten on the next regeneration. An answer that says "add a
          case to the switch in error.c" has described a change that does not survive a build.
        refs:
          - ["scripts/generate_errors.pl", 1, 30]

      - text: >-
          states that MBEDTLS_ERROR_C is ENABLED in the shipped mbedtls_config.h, so the string
          table is present in a default build
        type: conclusion
        weight: 2
        evidence: |
          mbedtls_config.h:2907 is `#define MBEDTLS_ERROR_C`, uncommented. This is the opposite
          of the threading and platform-memory defaults, and an answer that has generalised
          "mbedtls ships everything off" gets it wrong.
        refs:
          - ["include/mbedtls/mbedtls_config.h", 2898, 2907]

      - text: >-
          identifies MBEDTLS_ERROR_STRERROR_DUMMY as a separate switch that keeps mbedtls_strerror
          LINKABLE while the string table is compiled out, and states that it too is enabled by
          default
        type: conclusion
        weight: 3
        evidence: |
          mbedtls_config.h:1170 is `#define MBEDTLS_ERROR_STRERROR_DUMMY`, uncommented, with the
          rationale at :1158-1164 ("make integration of third party libraries easier when
          MBEDTLS_ERROR_C is disabled"). library/error.c:12 opens on
          `#if defined(MBEDTLS_ERROR_C) || defined(MBEDTLS_ERROR_STRERROR_DUMMY)` and :862-874 is
          the `#else` providing a mbedtls_strerror that writes an empty string.

          The distinction being tested is between "the function is gone" and "the function is
          there and returns nothing" — a caller links either way, which is the entire point.
        refs:
          - ["include/mbedtls/mbedtls_config.h", 1158, 1170]
          - ["library/error.c", 862, 874]

      - text: >-
          identifies MBEDTLS_ERROR_ADD / mbedtls_error_add as the way a high-level and a low-level
          code are combined, and notes that it captures __FILE__ and __LINE__
        type: conclusion
        weight: 2
        evidence: |
          error.h:113-114 defines MBEDTLS_ERROR_ADD(high, low) as
          `mbedtls_error_add(high, low, __FILE__, __LINE__)`; :142-153 is the static inline that
          adds them. The file and line are (void)-cast away unless MBEDTLS_TEST_HOOKS routes them
          to mbedtls_test_hook_error_add.
        refs:
          - ["include/mbedtls/error.h", 106, 153]

      - text: the inputs the generated error.c is built from
        type: set
        weight: 2
        extract: |
          List every file or directory the answer names as an INPUT to generating the error-string
          code (the generator script, its template, or the sources it reads). One per line, as the
          answer writes them. If the answer names none, reply NONE.
        members:
          - value: scripts/generate_errors.pl
            evidence: "the generator, invoked by both Makefile and CMakeLists"
          - value: scripts/data_files/error.fmt
            evidence: "the template it fills in"
          - value: include/mbedtls
            evidence: "the public headers it scans for documented error #defines"

  - id: Q5
    intent: |
      A LAYERING QUESTION WITH A SMALL PUBLIC FACE. The public header exposes exactly one
      function; the machinery behind it is three internal files, four architecture-specific
      assembly paths, a portable fallback that works by a completely different trick, and
      twenty-one consuming modules. No single file states the shape.

      The specific trap is the fallback. An answer that reads constant_time_impl.h's asm blocks
      concludes "constant time is implemented in assembly"; the non-asm path uses an extern
      volatile global instead, and it is the path any non-GNU-C compiler takes.

    prompt: |
      mbedtls has code that is written to run in constant time. How is that actually enforced at
      the instruction level, what happens on a compiler that cannot support it, and how far does
      the facility reach into the rest of the library?

    marks:
      - text: >-
          names mbedtls_ct_compiler_opaque as the primitive that stops the compiler from knowing a
          value, and locates it in library/constant_time_impl.h
        type: retrieval
        weight: 1
        evidence: |
          library/constant_time_impl.h:85-93.
        refs:
          - ["library/constant_time_impl.h", 76, 93]

      - text: >-
          explains that the asm path is an EMPTY asm volatile statement with the value as an
          input-output register operand — it emits no instruction and exists solely as an
          optimisation barrier
        type: conclusion
        weight: 3
        evidence: |
          constant_time_impl.h:88 is `asm volatile ("" : [x] "+r" (x) :);`. The instruction string
          is empty. An answer that describes "hand-written constant-time assembly" for this
          function has misread what the block does.
        refs:
          - ["library/constant_time_impl.h", 85, 93]

      - text: >-
