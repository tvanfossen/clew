    title: |-
        Before you answer anything: is what you are reasoning from complete?
    prompt: |-
        You are about to be asked questions about this repository. First: establish whether what you will reason from actually covers it. Say what you checked and what came back, what you found missing or under-covered, what you did about it, and what that cost as a measured number. If you changed anything to widen the coverage, say what you changed and why stating it was better than guessing.
    marks:
    - text: |-
        **the coverage check comes FIRST inside this answer** — the basis is established before the answer makes any claim about what mbedtls contains, rather than the claims arriving first and a check being appended to them. Judge the ORDER OF THIS ONE ANSWER; a cell answers one question, so nothing here rests on what a later question would have done
      arm_only: db
      symbols: []
      refs: []
    - text: |-
        states the basis as something **checked** — naming what it ran and what came back — rather than an assumption that the default view is complete
      arm_only: db
      symbols: []
      refs: []
    - text: '**notices that this library guards nearly every function body behind conditional compilation**,
        and that a view taken with nothing declared therefore under-covers it — this is a fact about mbedtls,
        findable in `library/*.c` and `include/mbedtls/mbedtls_config.h`'
      arm_only: db
      symbols: []
      refs:
      - - mbedtls_config.h
    - text: |-
        **acts on the gap rather than only reporting it** — names the configuration it needs covered instead of leaving the shortfall as a caveat
      arm_only: db
      symbols: []
      refs: []
    - text: |-
        **states the declaration explicitly rather than deriving it** from the library's own configuration file; a guessed policy is not a stated one, and an answer that says it inferred what to cover has done the thing this mark exists to distinguish
      arm_only: db
      symbols: []
      refs: []
    - text: |-
        **reports the cost as a measured number.** Zero is valid only if nothing was done, and it must be stated rather than omitted
      arm_only: db
      symbols: []
      refs: []
    - text: |-
        **CONFIRMS, in this same answer, that the correction took effect** — having widened the coverage it checks again and says what came back the second time, rather than asserting that the change worked. Mark 4 grades acting on the gap; this one grades closing it and verifying the close inside one answer, which is what a single cell can actually evidence
      arm_only: db
      symbols: []
      refs: []
    - text: '**says what it changed** — so a reader can tell which of its answers rest on the default coverage
        and which on the widened one, rather than presenting a widened view as if it had been the default'
      arm_only: db
      symbols: []
      refs: []
    - text: |-
        distinguishes "not present in this repository" from "not present in what I can currently see", which are different claims needing different evidence
      arm_only: db
      symbols: []
      refs: []
