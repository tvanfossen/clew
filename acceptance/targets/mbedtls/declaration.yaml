# SPDX-License-Identifier: MIT
#
# What Mbed-TLS/mbedtls has to DECLARE, stated for the acceptance build.
#
# WHY THIS FILE EXISTS HERE AND NOT IN THE TARGET. A third-party clone must stay
# byte-identical — the harness `git clean`s it, and a `.clew.yaml` written into it
# would be both destroyed and a modification of the thing being measured. So the declaration
# lives with the target's rubric, is committed, and is passed with `--declare`. Stated options
# are recorded in `build_meta` and replayed by later refreshes (#366), so this is read once per
# fresh build rather than on every query.
#
# NOTHING HERE IS A WORKAROUND FOR A MISSING FEATURE. Declaring a repository's own conventions
# is the designed path; the failure this closes is that nothing TOLD an owner to declare it,
# which is what `status.diagnostics` now does.
#
# Reproduce a build with it:
#   .venv/bin/python -m clew \
#       --output "$(.venv/bin/python -c 'import sys;sys.path.insert(0,".");from pathlib import Path;from clew.mcp_server.state import target_for;print(target_for(Path(sys.argv[1])).db_path)' /path/to/mbedtls)" \
#       --repo-root /path/to/mbedtls --declare acceptance/targets/mbedtls/declaration.yaml --rebuild

# ─── the lock primitive: a FUNCTION POINTER pair, which no default can reach ───
#
# mbedtls does not call a lock primitive directly. `include/mbedtls/threading.h:111-114`
# declares four `extern` function POINTERS, bound in `library/threading.c:101-104` to the
# pthread implementations and rebindable at run time through `mbedtls_threading_set_alt`
# (`library/threading.c:133-154`). Every one of the 48 call sites goes through the pointer.
#
# TWO CONSEQUENCES, and together they are why the default set is structurally blind here:
#   * `mbedtls_mutex_lock` is not in `DEFAULT_LOCK_PATTERNS`, so the lexical match never fires.
#   * the fnptr layer resolves each call to the BOUND implementation
#     (`threading_mutex_lock_pthread`), so the pointer's own name never appears as a callee —
#     which is also why `detect_undeclared_lock_primitives` reads `memberdef` rather than call
#     sites to find it.
#
# `releases` is the load-bearing key. Without a release token `_section_for` refuses the
# extent outright, so every critical section would stay NULL and the layer would report
# acquisitions with no bodies. It is also the key the INLINE option route rejected until
# #413 — the same declaration was legal in a file and refused as a build option.
locks:
  locks:
    - name: mbedtls_mutex_lock
      form: call
      releases: mbedtls_mutex_unlock
      kind: mutex
      mode: exclusive
      role: scoped
      operand_index: 0

# ─── what in this repository mbedtls did not write ───
#
# `3rdparty/` holds `everest` and `p256-m`: third-party implementations mbedtls ships but did
# not author. It is COMMITTED, not a submodule — the only submodule in this tree is
# `framework` — so `dg_external_root` is correctly NULL across all 570 indexed rows and no
# git-tree test will ever find it. That is exactly why D4 keeps `external` meaning "a git tree"
# and adds this as a SEPARATE declared signal rather than widening the definition: a copied-in
# third-party header with no git tree of its own IS first party by the only test that cannot be
# argued with, namely that this repo committed it and ships it.
#
# Declaring it changes what the index can SAY, never what it counts — `coverage`, `graph_stats`
# and every orphan figure stay first-party-by-git-tree and do not move.
vendored:
  - 3rdparty

# ─── where this repository keeps its own documentation target (gh#420) ───
#
# `discover_doxyfile` looks for a file NAMED `Doxyfile` in the repo root, `docs/` and `doc/`,
# and refuses to guess further — it was once caught taking `sorted(repo.glob("*/Doxyfile"))[0]`
# and selecting a test FIXTURE's Doxyfile to index a whole project. mbedtls keeps its at
# `doxygen/mbedtls.doxyfile`: wrong directory AND wrong filename. So the file was unreachable
# from both routes, and `scope.doxyfile_*` stayed empty on the ONE target whose rubric asks
# about it — six of Q4's marks turn on the doc build's declared scope.
#
# STATING IT CHANGES WHAT THE INDEX CAN SAY, NOT WHAT IT INDEXES. Since gh#333 a Doxyfile's
# INPUT, EXCLUDE* and FILE_PATTERNS are all REPLACED for indexing purposes — honouring them
# punished a repo for documenting itself, and this file's own `FILE_PATTERNS = *.h` with
# `INPUT = ../include` yields 1,571 header declarations and zero of 108 `library/*.c`
# implementations. What it adds is ALIASES, PREDEFINED, and the recorded fact that this
# repository publishes an API reference covering headers only.
doxyfile: doxygen/mbedtls.doxyfile

# ─── the config space: threading is OFF in the default config ───
#
# `MBEDTLS_THREADING_C` and `MBEDTLS_THREADING_PTHREAD` are COMMENTED OUT in the shipped
# `include/mbedtls/mbedtls_config.h`, which is a graded fact rather than a defect (see the
# rubric). Stating them as predefined is what lets doxygen's preprocessor reach the guarded
# bodies — without it the whole threading layer is behind an `#if` doxygen evaluates as false,
# and the index would honestly report a repository with no locking at all.
#
# THIS IS NOT PRE-ANSWERING THE QUESTION. It changes which SOURCE is compiled into the index,
# not what the index says about it; the source arm reads the same guarded code with no
# equivalent step, because `grep` does not evaluate `#if`.
preprocessor:
  predefined:
    - MBEDTLS_THREADING_C
    - MBEDTLS_THREADING_PTHREAD
  # AND WHERE THE REPOSITORY'S OWN DEFAULT LIVES, which is what stops the two macros above from
  # being read as a fact about mbedtls. Measured 2026-08-14: with `predefined` stated and no
  # `config_header`, every reply reported `configured_macros: "MBEDTLS_THREADING_C" ...` and
  # labelled all 154 gate rows `origin: "declared"` — so an agent concluded the repository
  # enables threading, when this file has both COMMENTED OUT (`:3787` and `:2196`). Two graded
  # marks ask for exactly that shipped state, and the payload argued against them.
  #
  # Declaring it does not change what is indexed. It gives `macros_meaning` a FILE to name, which
  # turns a disclaimer an agent can ignore into a route that settles the question in one read.
  config_header: include/mbedtls/mbedtls_config.h
