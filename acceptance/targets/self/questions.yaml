# SPDX-License-Identifier: MIT
#
# THE GRADING KEY FOR THE SELF TARGET. Schema and rules: acceptance/DESIGN.md.
#
# WHY THIS TARGET EXISTS. Every other reference repository is C or C++. The query surface works
# on Python — doxygen indexes it and the tree-sitter recovery path covers it — but only the
# richness layers are C/C++-specific, so "it works on Python" has been an assertion about a
# capability rather than a measurement of one. This is the only Python datapoint in the set.
#
# GROUND TRUTH IS SOURCE-DERIVED, WHICH MATTERS MORE HERE THAN ANYWHERE ELSE. The target IS the
# tool, so an index-derived figure would move whenever the pipeline moved and the rubric would
# silently grade the tool against its own output. Every mark below was verified by reading the
# module source at the pinned commit — never a query reply.
#
# THE PIN WILL GO STALE FAST. This repository changes daily. A grid run against a different
# commit is not comparable to one run against this pin, and `check_revision` refuses on a
# mismatch rather than letting the two drift quietly. MOVING THE PIN IS ALLOWED ONLY WITH THE
# DIFF CHECKED: `git diff --stat <old>..<new> -- clew/` must be empty over the modules these
# marks cite, or the marks must be re-verified.
#
# NO MARK GRADES THIS PROJECT'S OWN BUG HISTORY. A rubric must grade the TARGET REPOSITORY —
# what the code does now — not the sequence of defects that produced it. Where a docstring
# records why a design was chosen, the mark asks for the DESIGN and its consequence, which is
# readable from the source, not for the issue number.

# RE-PINNED 58206339 -> a6dd8ed9, AND THE MANDATED DIFF WAS NOT EMPTY. `git diff --stat
# 58206339..a6dd8ed9 -- clew/` reports one changed line: clew/synth.py:188, the `@return` of
# `claims`, corrected from "True for a JS/TS source file" to the types it actually claims. That
# line is INSIDE a cited span (["clew/synth.py", 186, 199]), so the rule above required the mark
# to be re-verified rather than carried over. It was: the span still covers the comment block,
# the signature and the body, and the mark's claim — that `claims` is the membership test — holds
# at both commits and is better evidenced at the second.
#
# TEACHING TO THE TEST, DISCLOSED. docs/CORE_HYPOTHESIS.md requires this said plainly: Q6 and the
# two marks added at 1.1.0 (Q1's front-end/binary filters, Q2's not-indexed report) grade code
# written by the same author in the same sitting that wrote the marks. They were derived the way
# the schema requires — from what a complete answer contains — but the conflict is real and the
# score for this target is read with it attached. No other target has it.
#
# Q3-Q5 were added to reach five questions, and Q6 at 1.1.0 for the file types that release
# added — without it the grid says nothing about the headline feature of the version it
# measures. THE ONE-FILE HAZARD IS SHARPEST ON THIS TARGET:
# this repository documents its reasoning in module docstrings, so a question whose answer is
# one module's docstring cannot discriminate however good the reasoning is. Each of the three
# is therefore built on a fact that no single file states — the three staleness axes are
# interpreted, measured, attached, sized and enforced in five different modules; the two
# neighbour surfaces make OPPOSITE decisions about fuzzy edges with each site documenting only
# its own; and the precedence rule, its tier-2 source, its tier-1 entry point and its record of
# what won are four modules of which none holds two.

schema: 1

target: tvanfossen/clew
commit: a6dd8ed919e69dd0549ae2b14306c339c62db0a2
version: 5.0.0

ground_truth: |
  clew's own source at the commit above, read directly. Line numbers were taken from the
  working tree at that commit with no modifications.

judge:
  model: claude-sonnet-4-5-20250929
  samples_when_weight_at_least: 2

questions:
  - id: Q1
    intent: |
      Probes whether the agent stops at "there is a scope resolver" — one lookup, both arms —
      or reaches the two design decisions that make the scope what it is: that a Doxyfile's
      INPUT is deliberately NOT honoured, and that nested git trees are indexed rather than cut
      out. Both are reversals of the obvious implementation, so an agent that has only located
      the function will describe the obvious version and be wrong.

    prompt: |
      When clew indexes a repository, what decides which files end up in the index? Walk
      through how that decision is made and what happens when nothing has been declared.

    marks:
      - text: names derive_scope in clew/scope.py as where the decision is resolved
        type: retrieval
        weight: 1
        evidence: |
          clew/scope.py:639, returning a DerivedScope.
        refs: [["clew/scope.py", 634, 660]]

      - text: >-
          states that a repository's own declared index_scope is preferred, and that every
          failure to find one falls through to indexing the whole repository
        type: conclusion
        weight: 3
        evidence: |
          derive_scope reads the declaration and returns whole_repo_scope (clew/scope.py:683) on
          every failure mode — no config, no index_scope section, no declared root that exists.
        refs: [["clew/scope.py", 640, 643], ["clew/scope.py", 678, 683]]

      - text: >-
          conveys that the fallback carries a REASON explaining which scope was used and why,
          so an unstated scope is never silently guessed
        type: conclusion
        weight: 2
        evidence: |
          whole_repo_scope carries the reason; a rejected declaration is logged as a WARNING as
          well as returned, because a reason carried only in the payload leaves the log still
          claiming absence.
        refs: [["clew/scope.py", 640, 643], ["clew/scope.py", 669, 673]]

      - text: >-
          states that a Doxyfile's own INPUT is deliberately NOT used to decide the indexed
          tree, and explains why — a repository that ships one would get only its documented
          subset while a repository that ships none gets its whole tree
        type: conclusion
        weight: 3
        evidence: |
          The Doxyfile fallback was removed from derive_scope. Honouring it made a documentation
          target stand in for a reasoning boundary, which penalises a repository for documenting
          itself. The index says what should be REASONED ABOUT; the gate says what must be
          DOCUMENTED, and coupling them forces a repo to loosen its quality bar to widen its
          graph.
        refs: [["clew/scope.py", 645, 649]]

      - text: >-
          states that nested git trees are INDEXED and tagged rather than excluded from the
          scope
        type: conclusion
        weight: 3
        evidence: |
          The containment pass that cut nested trees out of every scope was removed, not
          bypassed — tagging lives in clew/external.py. A trace that stops at a submodule
          boundary answers "this call leaves the repo" when it could answer what the call does.
        refs: [["clew/scope.py", 651, 655]]

      - text: >-
          conveys that the containment call was REMOVED rather than left in place with its
          callers dropped
        type: conclusion
        weight: 2
        evidence: |
          A containment call left in place with its callers removed is a safety property that
          reads as enforced and is not. Stated explicitly in derive_scope's docstring.
        refs: [["clew/scope.py", 653, 655]]

      - text: >-
          states that the resolved scope is not the whole answer — within it, a file reaches the
          index only if something can read it, and names at least one of the two filters: the
          parse-built front end claiming the file types doxygen cannot read, or binary
          classification dropping files whose extension lies about them
        type: conclusion
        weight: 2
        evidence: |
          ADDED AT 1.1.0, because the complete answer changed. `derive_scope` decides the
          BOUNDARY; two further filters decide membership inside it, and a reader who stops at
          the scope concludes that everything under the declared roots is indexed.

          `clew/synth.py:83` — CLAIMED_EXTS is the union of three groups: JS/TS, shell + CMake
          (symbol-bearing), and `.yaml`/`.yml`/`.json`, which are registered so they are in the
          file set and carry no symbols. `claims` (:186-199) is the test and `register_paths`
          (:213-242) writes the rows, before the shared parse, because the harvest's file set IS
          the `path` table.

          `clew/filetypes.py:41-56` — `binary_file` classifies from metadata and the first 8 KiB,
          so a 2 GB zip named `.c` is skipped by the index AND the gate before anything parses or
          hashes it.

          EITHER filter earns this mark. Both is better and is not required: the component under
          test is that the scope is a boundary rather than the membership rule.
        refs:
          - ["clew/synth.py", 56, 83]
          - ["clew/synth.py", 186, 199]
          - ["clew/filetypes.py", 41, 56]

  - id: Q2
    intent: |
      Probes the difference between "the search returned nothing" and "the search returned
      nothing AND said how much that is worth". The surface fact is one lookup. The components
      that matter are why the strong wording is earned per call rather than attached to a
      result shape, and why exactly one absent-corpus downgrade exists — the second was built
      and reverted, which is a design conclusion readable from the source and invisible to an
      agent that only located the function.

    prompt: |
      A search against a clew index comes back with no rows. How does the reply distinguish
      "this repository does not contain that" from "I did not look in the place it lives", and
      how much confidence is each answer entitled to?

    marks:
      - text: locates the grading in clew/mcp_server/emptiness.py
        type: retrieval
        weight: 1
        evidence: |
          The module's whole job. _verdict is at :330.
        refs: [["clew/mcp_server/emptiness.py", 355, 395]]

      - text: >-
          states that the strong wording is EARNED PER CALL by querying which corpora the search
          did not read, rather than being attached to a result shape
        type: conclusion
        weight: 3
        evidence: |
          _verdict calls unsearched_corpora (clew/query/symbols.py:1806), which asks the database
          which corpora search did not read and whether any holds this query. "Definitive" is
          asserted only after that comes back empty.
        refs: [["clew/mcp_server/emptiness.py", 363, 368], ["clew/query/symbols.py", 1806]]

      - text: >-
          explains that a single token matching nothing was previously treated as proof of
          absence, and that this confuses "nothing exists" with "I did not look there"
        type: conclusion
        weight: 3
        evidence: |
          Stated in _verdict. The distinction is the module's reason for existing.
        refs: [["clew/mcp_server/emptiness.py", 357, 364]]

      - text: >-
          states that the downgrades are ORDERED most-specific first, and explains why — a
          matching row in an unread corpus is a statement about THIS query and outranks
          statements about the index as a whole
        type: conclusion
        weight: 3
        evidence: |
          If a typedef matched, saying "rebuild to get file docs" would send the caller to fix
          the wrong thing.
        refs: [["clew/mcp_server/emptiness.py", 369, 373]]

      - text: >-
          conveys that there is exactly ONE absent-corpus downgrade and that keeping it to one is
          deliberate, because downgrading on every absent layer turns the grading into a blanket
          hedge
        type: conclusion
        weight: 3
        evidence: |
          A second downgrade was built and reverted. Most indexes lacking a layer lack it because
          a hand-built fixture never made one, so downgrading on absence would hedge nearly every
          reply and spend the strong wording the module exists to earn.
        refs: [["clew/mcp_server/emptiness.py", 374, 381]]

      - text: >-
          conveys the general rule the module leaves behind — fix the corpus, not the sentence
          about the corpus
        type: conclusion
        weight: 2
        evidence: |
          A wording change that compensates for missing data hedges every honest answer to
          excuse one dishonest one. The motivating case was fixed upstream in the harvest, after
          which the query returns rows and never reaches this grading at all.
        refs: [["clew/mcp_server/emptiness.py", 55, 57]]

      - text: >-
          distinguishes all three grades an empty reply can receive: definitive for the scope,
          definitive for a reason that is not absence, and not definitive
        type: conclusion
        weight: 3
        evidence: |
          The module docstring enumerates exactly three. (1) a single token matched nothing in
          any corpus, so retrying will not help; (2) the pattern's extension appears in no
          indexed file at all — certain about the index AND about why, which makes "widen the
          scope" the next move rather than "give up"; (3) an over-specified conjunction or a
          corpus this index does not carry, where the reply names the token that emptied it.

          NOT A SET MARK, deliberately. Set members are compared on a normalised key built for
          paths and identifiers; prose values are fragile under it, since an answer saying
          "definitive" would not match a member spelled "definitive for the scope". A set mark
          whose members have no canonical spelling grades phrasing.
        refs: [["clew/mcp_server/emptiness.py", 31, 37]]

      - text: >-
          states that the reply also names the file types that WERE in scope and produced no
          rows, so "this repository does not contain that" and "that file type is not indexed
          here" are distinguishable rather than the same empty answer
        type: conclusion
        weight: 3
        evidence: |
          ADDED AT 1.1.0, because this is the component the question asks for and the index could
          not previously supply. `IndexScope` already stated which extensions the index HOLDS;
          the complement is the actionable half.

          `clew/cli.py:2640-2684` — `_not_indexed_scope` compares the build's scanned set against
          the `path` table and stamps `scope.not_indexed` (`ext=count`, ordered by count, capped)
          plus an exact `not_indexed_count`. MEASURED AT BUILD TIME because the comparison needs
          the tree the build walked; the working copy at query time is a different tree.

          `clew/query/corpus.py:321-340` reads the row back and `clew/query/models.py:1199-1200`
          carries it on `IndexScope`. An index built before the row existed reports `()` and `0`,
          and `emptiness._scope_payload` DROPS both keys in that case — "nothing was missed" and
          "nobody measured" must not read the same.

          An answer that only says "the index holds .py and .c" has the retrieval half. This mark
          is for concluding what that does for the caller: read the file directly, rather than
          trust the negative.
        refs:
          - ["clew/cli.py", 2640, 2684]
          - ["clew/query/corpus.py", 321, 340]
          - ["clew/query/models.py", 1190, 1200]

  - id: Q3
    intent: |
      THE TOOL DESCRIBING ITS OWN CURRENCY. "Is the index stale" reads like one boolean, and a
      single boolean is what the code deliberately does not have — there are three axes, each
      cleared by a different action, and one of them cannot be cleared by the consumer at all.

      The discriminating shape is that no file holds the whole mechanism. The axes and their
      remedies are interpreted in one module, measured from a payload produced by another,
      stamped onto every query reply by a third, sized against a response budget by a fourth,
      and enforced as a write refusal by a fifth. Reading any one of them yields a coherent and
      incomplete answer.

      The sharpest component is the read/write asymmetry on the `code` axis. A stale process
      reads live data — query tools open the database per call — and writes dead logic, so the
      honest notice has to carry an exemption and a hazard in the same breath, and the refusal
      is placed where `force` cannot argue past it.

    prompt: |
      A clew index can be out of date. How does the tool know, what does it tell the caller, and
      what does the caller do about it?

    marks:
      - text: >-
          states that staleness is THREE distinguishable axes rather than one flag, and names
          them
        type: retrieval
        weight: 1
        evidence: |
          clew/mcp_server/freshness.py:62-64 declares AXIS_DATA, AXIS_CODE and AXIS_SCHEMA as the
          stable tokens; the module docstring at :2-21 lays out what each one means.
        refs:
          - ["clew/mcp_server/freshness.py", 60, 65]

      - text: >-
          explains that each axis is cleared by a DIFFERENT action — a rebuild for data, a client
          restart for code — which is why one flag would not have been enough
        type: conclusion
        weight: 3
        evidence: |
          freshness.py:2-21. The `data` axis means the database is older than the source and a
          rebuild clears it; `code` means the running process imported its modules at launch, so
          only restarting the client clears it. The module exists to turn already-measured fields
          into the sentence naming the action.
        refs:
          - ["clew/mcp_server/freshness.py", 2, 22]

      - text: >-
          identifies that the schema axis can be UNRESOLVABLE — when the index is newer than the
          server, no rebuild clears it, because rebuilding re-stamps the same newer version
        type: conclusion
        weight: 3
        evidence: |
          freshness.py:17-21: build_version against expected_build_version, and when the index is
          the newer of the two "stale: true is UNRESOLVABLE by any action the consumer can take".
          This is the axis that changes what advice is correct, and an answer that offers
          "rebuild" as the universal remedy is wrong here specifically.
        refs:
          - ["clew/mcp_server/freshness.py", 16, 22]
          - ["clew/mcp_server/freshness.py", 407, 442]

      - text: >-
          states the read/write asymmetry on the code axis: READS stay current because query
          tools open the database per call, while a BUILD through a stale process writes old
          pipeline logic
        type: conclusion
        weight: 3
        evidence: |
          The two halves are written once as constants, freshness.py:69-77 — _READ_EXEMPTION
          ("query tools open the database per call and read it live") and _WRITE_HAZARD ("can
          silently DROP WHOLE LAYERS and then report the result as healthy") — precisely so the
          notice and the refusal cannot drift apart.

          Stating only the read exemption is the failure this wording exists to prevent: it tells
          a reader not to worry immediately before the case that matters.
        refs:
          - ["clew/mcp_server/freshness.py", 66, 80]
          - ["clew/mcp_server/freshness.py", 24, 41]

      - text: >-
          identifies that the write path REFUSES rather than warning, and that the refusal is
          placed ahead of the build decision so a force flag cannot override it
        type: conclusion
        weight: 3
        evidence: |
          clew/mcp_server/server.py:2276-2280: `stale_code_refusal(identity)` is consulted after
          target resolution and before the build lock is taken, returning
          `{"ok": False, "error": refusal}`. The docstring at :1080-1086 states the placement
          rationale — after target resolution so a missing target keeps its own answer,
          immediately before the lock so nothing can be written past it.

          The refusal's wording lives in freshness.stale_code_refusal (:370), not at the call
          site, which is what keeps it identical to the notice.
        refs:
          - ["clew/mcp_server/server.py", 2262, 2282]
          - ["clew/mcp_server/freshness.py", 526, 564]

      - text: >-
          states that the annotation RIDES ON EVERY QUERY REPLY rather than waiting to be asked
          for, and that it is empty on a current tool
        type: conclusion
        weight: 3
        evidence: |
          clew/mcp_server/server.py:1544-1570 supplies the notices; clew/mcp_server/tools_query.py
          :1583-1605 attaches them on the way out of each reply. `notices` (freshness.py:567-591)
          returns only the axes actually in play, and its docstring names the empty case as the
          load-bearing half: "a warning that is always present is a warning nobody reads".

          A status call reports the same facts, but reading it requires already suspecting a
          problem — which a consumer holding a fresh-looking answer does not have. That is the
          design decision the question is asking for.
        refs:
          - ["clew/mcp_server/server.py", 1544, 1570]
          - ["clew/mcp_server/freshness.py", 567, 591]

      - text: >-
          identifies that measuring staleness NEVER raises — a failed measurement degrades to no
          annotation rather than turning a successful reply into an error
        type: conclusion
        weight: 2
        evidence: |
          server.py:1566-1570 wraps the measurement in a bare `except Exception` that logs at debug
          and returns an empty list; tools_query.py:1896-1905 returns [] when no provider is
          bound. Both docstrings state the contract in the same words, because the function runs
          on the way out of replies that already succeeded.
        refs:
          - ["clew/mcp_server/server.py", 1544, 1570]
          - ["clew/mcp_server/tools_query.py", 1890, 1905]

      - text: >-
          states that a routed reply is annotated for the repository it actually read, not for
          the server's default target
        type: conclusion
        weight: 2
        evidence: |
          tools_query.py:1899-1901 takes `answering.staleness` when a target was routed and falls
          back to the provider only otherwise. The docstring gives the reason: a warning about a
          database this reply never opened is worse than silence, because the caller would act
          on it.
        refs:
          - ["clew/mcp_server/tools_query.py", 1890, 1905]

      - text: >-
          identifies that the annotation is fitted to the response budget by degrading its
          wording rather than by dropping the warning
        type: conclusion
        weight: 2
        evidence: |
          tools_query.py:152-191. `_staleness_within_budget` measures the room the real payload
          left, then takes the first of three tiers that fits: full prose, a compact per-axis
          message (:139-142), and a minimal one (:143). The docstring gives the reason for
          compacting rather than dropping — a warning that disappears exactly when the answer is
          largest inverts the point.
        refs:
          - ["clew/mcp_server/tools_query.py", 152, 191]

      - text: the modules a staleness warning passes through
        type: set
        weight: 1
        extract: |
          List every file path the answer names as taking part in measuring staleness, wording
          it, attaching it to a reply, or acting on it. Paths only, one per line, exactly as the
          answer writes them. If the answer names none, reply NONE.
        members:
          - value: clew/mcp_server/freshness.py
            evidence: "the axes, their messages, and the write refusal's wording"
          - value: clew/mcp_server/server.py
            evidence: ":549-571 supplies the notices, :1113-1118 refuses a stale build"
          - value: clew/mcp_server/tools_query.py
            evidence: ":1583-1605 attaches them, :152-187 sizes them"
          - value: clew/mcp_server/state.py
            evidence: "db_status, the measured payload the data and schema axes read"

  - id: Q4
    intent: |
      ONE STORED ROW SHAPE, TWO SURFACES THAT READ IT DIFFERENTLY ON PURPOSE. `call_edges`
      stores one row per extraction LAYER — the uniqueness constraint makes `source` part of the
      key — so the same logical edge found by two detectors is two rows. Neither surface returns
      those rows as stored, and they diverge on two separate decisions, each documented at its
      own site and neither documented at both.

      The question cannot be answered from the storage module, which knows nothing about
      collapsing; nor from either query surface, since each states its own choice and names the
      other only in passing; nor from the vocabulary, which holds the ranking that decides the
      collapse but nothing about who applies it.

      The trap is treating a neighbour list as a list of calls. It is not — `callers` merges
      shared-key dataflow into the same list, tagged by a field the caller has to read, and a
      dataflow neighbour does not call the function and may run on another thread.

    prompt: |
      clew can tell you what calls a function. What is actually in that answer, and what would
      make it wrong to read it as a list of call sites?

    marks:
      - text: >-
          states that call_edges stores one row per extraction LAYER, so the same logical edge
          found by two detectors is stored twice
        type: retrieval
        weight: 1
        evidence: |
          clew/call_edges.py:129 declares `UNIQUE(caller_rowid, callee_rowid, source)`, which
          makes the producing layer part of the key.
        refs:
          - ["clew/call_edges.py", 120, 130]

      - text: >-
          concludes that the query surface returns ONE row per neighbour rather than one per
          layer, collapsing the variants to the strongest evidence
        type: conclusion
        weight: 3
        evidence: |
          clew/query/symbols.py:462-466 groups endpoint rows by identity and calls
          `_collapse_variants`, whose docstring (:279-301) records the measurement that forced it:
          520 rows for 260 distinct pairs on clew's own index — every neighbour list inflated
          exactly 2x, and every depth cap truncating half as many real edges as intended.

          The consequence worth stating is the direction: corroboration by two layers made an
          edge appear TWICE, so it looked like more evidence and was actually the same evidence
          counted twice.
        refs:
          - ["clew/query/symbols.py", 277, 302]
          - ["clew/query/symbols.py", 418, 427]

      - text: >-
          identifies that which layer's provenance a collapsed row reports is decided by a
          RANKING held in the vocabulary module, not by SQL
        type: conclusion
        weight: 3
        evidence: |
          `_collapse_variants` is `max(variants, key=_variant_rank)`; the ranks live on
          clew/vocabulary.py:216-253 as CALL_SOURCE's `rank` map. The comment at :418-419 states
          why the grouping is in Python — "the collapse rule is a ranking over a vocabulary, not
          something SQL should encode".

          The ranking itself is not the obvious one: a DECLARED dispatch edge outranks doxygen's
          own exact cross-reference, because the others are inferences graded by how well a name
          resolved while a declared edge is a statement of fact by whoever wrote the indirection.
        refs:
          - ["clew/vocabulary.py", 216, 253]

      - text: >-
          states that the same collapse function serves BOTH the flat neighbour surface and the
          traversal surface, so a chain and a neighbour list cannot disagree about one edge's
          provenance
        type: conclusion
        weight: 2
        evidence: |
          clew/query/symbols.py:279-285 gives the reason directly, and
          clew/query/traversal.py:130 calls back into `symbols._collapse_variants`. On the
          traversal side it was never an inflation bug but a DETERMINISM one: the hop dedup keeps
          the first row it sees and the query ordered only by neighbour name, so which layer's
          source a hop reported depended on SQLite's row order.
        refs:
          - ["clew/query/symbols.py", 279, 286]
          - ["clew/query/traversal.py", 124, 138]

      - text: >-
          identifies that the flat surface KEEPS fuzzy-confidence edges while the traversal
          surface excludes them, and gives the reason — a walk expands each hop, so one fuzzy
          edge multiplies into a wrong subtree
        type: conclusion
        weight: 3
        evidence: |
          clew/query/traversal.py:148 appends `AND e.confidence!='fuzzy'`;
          clew/query/symbols.py:399-405 states that `_direct_call_edges` deliberately does not,
          because a flat list has no amplification and the tool descriptions instruct a consumer
          to weigh `confidence` — filtering would make that field reference a value that can
          never appear.

          The scale argument is in the same docstring: fuzzy is 21.3% of this repository's own
          call edges and 79.8% of entropic's (26,101 of 32,720), so filtering on a C++ target
          would discard three quarters of the graph.

          Two files, opposite decisions, one shared reason. Each site documents its own choice;
          neither documents both.
        refs:
          - ["clew/query/symbols.py", 353, 372]
          - ["clew/query/traversal.py", 124, 150]

      - text: >-
          concludes that `callers`/`callees` return TWO KINDS of neighbour in one list —
          direct calls and shared-key dataflow — distinguished by an `edge_class` field the
          consumer must read
        type: conclusion
        weight: 3
        evidence: |
          clew/query/symbols.py:755-762 and :738-753. Both docstrings say it outright: a `'key'`
          neighbour does NOT call the function, and may run on another thread.

          This is the component that makes reading the reply as a list of call sites wrong, and
          it is not visible from the storage layer at all — the dataflow half comes from a
          different table and is merged at :704-707.
        refs:
          - ["clew/query/symbols.py", 714, 754]
          - ["clew/query/symbols.py", 700, 708]

      - text: >-
          notes that the causal polarity is INVERTED between the two halves — the "callers" of a
          reader are the functions whose writes it observes
        type: conclusion
        weight: 2
        evidence: |
          clew/query/symbols.py:717-719: `want_callers=True ⟺ as_writer=False`, stated as the
          causal analogue rather than a typo. A reader who assumes the two halves share a
          direction flag has the dataflow half backwards.
        refs:
          - ["clew/query/symbols.py", 714, 722]

      - text: >-
          states that dossier does NOT take the merged form — it asks for the call half only,
          because it already composes the dataflow separately and merging would report each
          dataflow edge twice in one payload
        type: conclusion
        weight: 3
        evidence: |
          clew/query/dossier.py:578-579 calls `_call_edges` without `include_dataflow`, which
          defaults to False; clew/query/symbols.py:721-726 gives the reason.

          Three files are needed for this one: the default lives in symbols, the reason lives in
          symbols' docstring, and the fact that dossier relies on the default is only visible at
          dossier's call site — which passes nothing, so a reader scanning for the flag finds no
          mention of it there at all.
        refs:
          - ["clew/query/dossier.py", 520, 530]
          - ["clew/query/symbols.py", 721, 728]

      - text: >-
          identifies that the two surfaces resolve the FOCAL side differently — the flat surface
          selects by resolved identity while the traversal surface still matches on the bare name
        type: conclusion
        weight: 3
        evidence: |
          clew/query/symbols.py:425-430 comments that filtering by name unioned every same-named
          function's edges onto whichever one was described, and :406 resolves
          `identity_rowids(conn, fn, qualified)` instead. clew/query/traversal.py:148 still reads
          `WHERE {focal}.name=?`.

          The asymmetry is real and neither file states it about the other. An answer that
          reports "edges are resolved by identity" without qualifying which surface has
          generalised from one of the two.
        refs:
          - ["clew/query/symbols.py", 394, 410]
          - ["clew/query/traversal.py", 144, 150]

      - text: the modules that decide what a neighbour list contains
        type: set
        weight: 1
        extract: |
          List every file path the answer names as taking part in storing call edges, collapsing
          them, filtering them, or deciding what a neighbour reply contains. Paths only, one per
          line, exactly as the answer writes them. If the answer names none, reply NONE.
        members:
          - value: clew/call_edges.py
            evidence: "the table and its per-layer uniqueness constraint"
          - value: clew/query/symbols.py
            evidence: "the collapse, the fuzzy decision, the dataflow merge"
          - value: clew/query/traversal.py
            evidence: "the other surface, with the opposite fuzzy decision"
          - value: clew/vocabulary.py
            evidence: "the source ranking the collapse compares"
          - value: clew/query/dossier.py
            evidence: ":526-527, the caller that takes the call half only"

  - id: Q5
    intent: |
      A PRECEDENCE QUESTION WHOSE RULE IS ASYMMETRIC, which is the part an answer most often
      gets wrong by assuming precedence means "the highest tier wins". Two of the five layers
      accumulate and cannot be displaced by anything; three replace each other. So a stated
      value corrects a guess and never removes a discovered fact.

      Four modules hold four different pieces and none holds two: the combination rule and the
      tier tokens; the tier-2 source with its section vocabulary; the tier-1 entry point with
      the same vocabulary spelled as option names; and the record of which tier actually won,
      derived from the stored rows rather than stamped beside them.

      The two refusals are the second half. A misspelled SECTION is refused by name against the
      allowed set; a misspelled ENTRY inside a well-named section is the quieter failure, and a
      correctly-spelled but derived key is refused with the REASON rather than as unknown —
      because "unknown option" sends a reader hunting a typo that is not there.

    prompt: |
      A repository wants clew to index it differently from the defaults. What are the ways to
      say so, and what happens when two of them disagree?

    marks:
      - text: >-
          identifies that layered build options resolve through FIVE named precedence tiers,
          rather than a single override
        type: retrieval
        weight: 1
        evidence: |
          clew/tiers.py:56-73 declares explicit, declared, target-fact, ecosystem and heuristic;
          the table at :8-16 gives each one's source.
        refs:
          - ["clew/tiers.py", 2, 20]
          - ["clew/tiers.py", 56, 73]

      - text: >-
          concludes that the rule is ASYMMETRIC — the stated tiers REPLACE one another while the
          discovered layers ACCUMULATE and survive whatever anyone states
        type: conclusion
        weight: 3
        evidence: |
          clew/tiers.py:4 states the combination as
          `resolved = (tier1 or tier2 or tier5) union tier3 union tier4`, glossed as "you can
          correct our guesses; you cannot un-discover a fact". `resolve_layered` at :330-338
          implements exactly that: `_ordered_unique((*facts, *ecosystem, *stated))`.

          The consequence is the point of the design: an operator stating an entry pattern
          cannot drop a discovered entry point, so reachability cannot collapse because someone
          passed a flag.
        refs:
          - ["clew/tiers.py", 2, 24]
          - ["clew/tiers.py", 291, 335]

      - text: >-
          states that tiers 3 and 4 combine IDENTICALLY, so the distinction between them is
          deliberately inert, and that the load-bearing line is fact-versus-guess
        type: conclusion
        weight: 3
        evidence: |
          clew/tiers.py:25-32 says so directly: both accumulate and both survive every stated
          tier, so an arguable 3-vs-4 call changes the label a reader sees and nothing about the
          resolved set. The distinction that matters is 3-or-4 versus 5 — "calling a fact a guess
          makes it discardable, and calling a guess a fact makes it permanent".

          An answer that presents five strictly-ordered tiers has described a rule the code does
          not implement.
        refs:
          - ["clew/tiers.py", 24, 33]

      - text: >-
          identifies `.clew.yaml` as the repository's own standing declaration — tier 2,
          discovered from the repo root by BOTH entry points rather than plumbed per section
        type: conclusion
        weight: 3
        evidence: |
          clew/declaration.py:2-54: one discovery path rather than two, both entry points already
          supplying the repo root. The filename is `CONFIG_FILE_NAME`, imported from `clew/guard/config.py` at :57 and re-exported as `DECLARATION_NAME` at :63 — one spelling for the gate and the index, and :22-36 shows each section
          holding exactly what the corresponding standalone manifest holds so there is one format
          to learn.

          The reason it is a repo-level file rather than a flag is stated at :36-38 — the file is
          the repo's standing statement and a flag is a deliberate one-off override.
        refs:
          - ["clew/declaration.py", 2, 40]

      - text: >-
          states that tier 1 is reachable from BOTH entry points — a CLI flag and a structured
          options argument — so an embedding caller with no shell can still state the top tier
        type: conclusion
        weight: 3
        evidence: |
          clew/buildoptions.py:2-9 exists for that caller, and its docstring names the failure a
          CLI-only top tier produces: "a five-tier precedence rule whose top tier no consumer can
          reach makes tier 5 the ceiling rather than the floor".

          This is not visible from tiers.py, which defines the rule and knows nothing about who
          can reach which tier.
        refs:
          - ["clew/buildoptions.py", 1, 16]

      - text: >-
          notes that the option names an embedding caller states are the SAME WORDS as the
          declaration file's section names, and the same words the diagnostics use
        type: conclusion
        weight: 2
        evidence: |
          clew/buildoptions.py:11-15: an operator who learns a key here has learned the key they
          would write into `.clew.yaml`, and the diagnostics name what the build could not see in
          that same vocabulary. Deliberate: the tool says what it missed in the words you answer
          in.
        refs:
          - ["clew/buildoptions.py", 10, 20]

      - text: >-
          identifies that an unknown SECTION is refused by name against the allowed set rather
          than ignored, and gives the reason — an ignored section builds with defaults while
          reporting the declaration was honoured
        type: conclusion
        weight: 3
        evidence: |
          clew/declaration.py:349-355 raises with the offending key, the file path it came from,
          and the full allowed set from KNOWN_SECTIONS (:234). The message states the failure it
          prevents in those words.
        refs:
          - ["clew/declaration.py", 345, 356]

      - text: >-
          identifies a SECOND refusal one level down — an unknown key INSIDE a well-named section
          — and that a correctly-spelled derived key is refused with its reason rather than as
          unknown
        type: conclusion
        weight: 3
        evidence: |
          clew/buildoptions.py:100-115 states the two levels explicitly, matching
          declaration.KNOWN_SECTIONS above them. `_refuse` at :383-395 branches: a derived key
          gets "cannot be stated: <why>", anything else gets "unknown build option — accepted:
          ...". The comment at :385-388 gives the reason — naming a correctly-spelled derived key
          "unknown" sends the reader hunting a typo that is not there.

          The entry level is the quieter of the two: a misspelled entry parses into a valid
          mapping that no consumer reads, so nothing raises and nothing applies.
        refs:
          - ["clew/buildoptions.py", 99, 115]
          - ["clew/buildoptions.py", 413, 430]

      - text: >-
          states that the winning tier is RECORDED with the index, and that the record is derived
          from the stored rows rather than stamped as a separate summary
        type: conclusion
        weight: 2
        evidence: |
          clew/tiers.py:540-564. `stated_options` scans the stored section for keys whose tier
          value is the explicit token, and its docstring gives the reason for deriving rather
          than storing: "a stored summary is a second source of truth that can disagree with the
          rows it summarises, which is exactly where a silent wrong answer hides".

          It also names what the record is FOR — a replayed statement makes the index a function
          of what an operator once said as well as of the commit, so two operators of one commit
          can hold different indexes, acceptable only because it is recorded.
        refs:
          - ["clew/tiers.py", 535, 564]

      - text: the modules that decide a build option's value
        type: set
        weight: 1
        extract: |
          List every file path the answer names as taking part in stating, discovering, combining
          or recording a build option. Paths only, one per line, exactly as the answer writes
          them. If the answer names none, reply NONE.
        members:
          - value: clew/tiers.py
            evidence: "the tier tokens, the combination rule, and the record of what won"
          - value: clew/declaration.py
            evidence: "tier 2, its section vocabulary and the unknown-section refusal"
          - value: clew/buildoptions.py
            evidence: "tier 1 for an embedding caller, and the entry-level refusals"

  - id: Q6
    intent: |
      Probes whether the agent stops at "1.1.0 reads shell and CMake" or reaches the three
      DIFFERENT treatments and the reason each file type gets the one it gets. The surface fact
      is a list of extensions, which one lookup yields. The components that matter are that
      being in the file set and carrying symbols are separate things, that an absent grammar
      degrades instead of failing, and that the discriminator cannot be the root node type.

      THE ONE-FILE HAZARD: the extension tuples are all in one module. So the marks that carry
      weight are spread — the capability gate is in a second module, the partition decision and
      its cost are in a third, and each language's discriminator is in its own walker.

    prompt: |
      clew reads file types doxygen cannot parse. For a repository that automates itself with
      shell and CMake and configures itself with YAML and JSON, what does clew's index actually
      hold about those files, what does it not hold, and what happens on an installation whose
      parser lacks those grammars?

    marks:
      - text: >-
          names the shell and CMake extensions, including CMakeLists.txt matched by file name
          rather than by extension
        type: retrieval
        weight: 1
        evidence: |
          clew/synth.py:62 `SCRIPT_EXTS = (".sh", ".bash", ".cmake")` and :69
          `SCRIPT_NAMES = ("cmakelists.txt",)`. The comment at :64-68 gives the reason the name
          is matched as a whole path component: a suffix test also claims `oldcmakelists.txt`,
          and claiming `.txt` would claim every `notes.txt` in the tree.
        refs:
          - ["clew/synth.py", 60, 69]

      - text: >-
          states that YAML and JSON are registered in the file set but carry NO symbols, so the
          two file groups are treated differently rather than alike
        type: conclusion
        weight: 3
        evidence: |
          clew/synth.py:71-80. YAML and JSON have no function concept at all — their grammars
          offer `block_mapping_pair` and `pair` — so a `path` row is written and nothing is
          harvested. The docstring states the cost of the alternative: putting every `steps:`
          key of every workflow file into the namespace that answers a question about a
          function.

          `claims` (:191-199) returns True for all of them, which is what puts them in the file
          set; `CLAIMED_EXTS` (:83) is the union of the three groups. Being claimed and carrying
          symbols are therefore separate properties of a file type.
        refs:
          - ["clew/synth.py", 71, 83]
          - ["clew/synth.py", 186, 199]

      - text: >-
          states that markdown is deliberately NOT given a path row, because it is prose and a
          path row would also count it as indexed source in coverage figures
        type: conclusion
        weight: 2
        evidence: |
          clew/synth.py:77-79. Markdown is excluded from `DATA_EXTS` on purpose and reaches the
          FTS index through clew/prose.py instead. This is the third treatment, and it is the
          one a reader who stops at "the new file types" misses entirely.
        refs:
          - ["clew/synth.py", 77, 80]

      - text: >-
          concludes that an installation lacking the grammars DEGRADES rather than failing — the
          router consults a capability gate before routing, and those file types are then
          reported as not indexed
        type: conclusion
        weight: 3
        evidence: |
          clew/harvest.py:213-225 `_grammar_available` consults clew/substrate.py for the keys in
          `_OPTIONAL_KEYS` (:145, `{"bash", "cmake"}`); an ungated route would raise, because the
          parser refuses an unknown language key. clew/substrate.py's docstring gives the reason
          the check is a CAPABILITY question and not a version comparison: the wheel carrying
          these grammars reports the same version string as the one without them.

          The comment at :142-144 draws the line — the other keys are NOT gated, because a parser
          without C or Python is a broken install and a loud failure is the right answer there.
          So "degrade quietly" is a decision made per grammar, not a blanket policy.
        refs:
          - ["clew/harvest.py", 140, 145]
          - ["clew/harvest.py", 208, 225]
          - ["clew/substrate.py", 2, 24]

      - text: >-
          states that the root node type cannot be the discriminator, because shell shares its
          root with JavaScript and CMake shares its root with Rust
        type: conclusion
        weight: 3
        evidence: |
          clew/shast.py:42-50 — `SH_ROOT = "program"`, shared with javascript, typescript and
          tsx, "a cheap pre-filter, never the discriminator". The test is the presence of a
          `function_definition` whose `name` field is a `word` (:48-50), which is what separates
          it from C's node of the same name.

          clew/cmakeast.py:36-46 — `CMAKE_ROOT = "source_file"`, shared with rust, same wording.

          A mark earns its place by what a complete answer contains: an answer that says "it
          detects shell files" without this has not explained how, and the obvious mechanism is
          wrong.
        refs:
          - ["clew/shast.py", 42, 50]
          - ["clew/cmakeast.py", 36, 46]

      - text: >-
          states that CMake's definition name is an ARGUMENT of the command rather than a named
          field of the node
        type: retrieval
        weight: 1
        evidence: |
          clew/cmakeast.py:43-46 maps each definition node to the command node holding its
          argument list; the name is read out of that list rather than from a field, which is
          where bash and CMake differ in shape.
        refs:
          - ["clew/cmakeast.py", 40, 49]

      - text: >-
          states that a shell function is recorded with no argument list and no return, because
          the language has neither
        type: retrieval
        weight: 1
        evidence: |
          clew/shast.py:127-144 — `args` and `ret` are both empty strings. The docstring gives
          the reason: arguments arrive as `$1`/`$@`, and reporting an invented signature would
          put a claim in the index that the source does not make.
        refs:
          - ["clew/shast.py", 127, 144]

      - text: >-
          states that both languages share ONE harvest partition, and gives the reason — a
          second partition would write an empty payload row per file per index
        type: conclusion
        weight: 2
        evidence: |
          clew/vocabulary.py:692-698. Every stage in the vocabulary is harvested over every
          indexed file, so a second partition on a 40,000-file target is 40,000 rows recording
          that a C file defines no shell function. The stated cost of the choice is that the two
          walkers are versioned together.

          This is the component no single module states: the extension lists say nothing about
          partitions, and the walkers say nothing about each other.
        refs:
          - ["clew/vocabulary.py", 692, 698]

      - text: the modules that decide how a non-C file type is read
        type: set
        weight: 1
        extract: |
          List every file path the answer names as taking part in deciding which file types the
          index covers, how a shell or CMake definition is recognised, or whether a grammar is
          available. Paths only, one per line, exactly as the answer writes them. If the answer
          names none, reply NONE.
        members:
          - value: clew/synth.py
            evidence: "claims the file types, registers the path rows, writes the memberdef rows"
          - value: clew/shast.py
            evidence: "the bash walker and its name-field discriminator"
          - value: clew/cmakeast.py
            evidence: "the CMake walker, whose name is a command argument"
          - value: clew/substrate.py
            evidence: "the capability gate the router consults before routing an optional grammar"
