          tier, so an arguable 3-vs-4 call changes the label a reader sees and nothing about the
          resolved set. The distinction that matters is 3-or-4 versus 5 — "calling a fact a guess
          makes it discardable, and calling a guess a fact makes it permanent".

          An answer that presents five strictly-ordered tiers has described a rule the code does
          not implement.
        refs:
          - ["clew/tiers.py", 24, 33]

