        What decides which files a build reads?
    prompt: |-
        This program hands a file set to an external documentation tool. Something in this codebase decides what that file set is. Find where that decision is made, lay out every input that can influence it and which one wins, and say what happens when a repository states nothing at all.
    marks:
    - text: |-
        names `derive_scope` in `clew/scope.py` as where the decision is made
      symbols: ['derive_scope']
      refs: [['scope.py']]
      veto_safe: true
    - text: |-
        states that there are exactly TWO outcomes — a declared `index_scope`, or the whole-repository default — rather than describing a longer chain of fallbacks
      symbols: []
      refs: []
    - text: |-
        identifies the whole-repository tier as the DEFAULT reached whenever no `index_scope` is declared, not as a last resort reached only after other options fail
      symbols: ['whole_repo_scope']
      refs: []
      veto_safe: true
    - text: |-
        names `index_scope` as the declaration section that selects the non-default tier
      symbols: []
      refs: []
    - text: |-
        reports that a declaration can arrive from more than one place — the dedicated `.clew.yaml`, the guard config's `x-` passthrough, or stated by an embedding caller — rather than naming only one
      symbols: []
      refs: []
    - text: |-
        states that a caller-stated scope reports its provenance differently, as stated by the caller rather than by naming a file, and gives the reason: naming a file that says nothing sends an owner to edit nothing
      symbols: []
      refs: []
    - text: |-
        **states that a Doxyfile no longer supplies the INPUT** — the doc build is a publishing target, not a reasoning boundary. An answer describing a Doxyfile fallback for INPUT is describing behaviour that was removed
      symbols: []
      refs: []
    - text: |-
        **states that a Doxyfile is still read for ALIASES and PREDEFINED**, so "the Doxyfile is ignored" is too strong
      symbols: []
      refs: []
      veto_safe: true
    - text: |-
        reports that the whole-repo tier subtracts the paths git ignores
      symbols: []
      refs: []
    - text: |-
        **notices that gitignored paths are gathered on BOTH sides of every nested-tree boundary**, and gives the reason — `git ls-files` stops at a submodule boundary, so the parent sweep reports nothing inside a nested tree
      symbols: []
      refs: []
    - text: |-
        reports that dot and cache directories are also subtracted, as things no repository restates
      symbols: []
      refs: []
    - text: |-
        **states that the doxygen-guard gate is NOT consulted for index scope**, and separates the two questions: the gate says what must be DOCUMENTED, the scope says what should be reasoned about
      symbols: []
