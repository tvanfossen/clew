# SPDX-License-Identifier: MIT
#
# THE GRADING KEY FOR THE SELF TARGET, AS DATA.
#
# WHY THIS TARGET EXISTS. Every other target in the reference set is C or C++. The query
# surface works on Python — doxygen indexes it, and gh#397 enabled the tree-sitter recovery
# path — but no graded measurement has ever covered a Python repository, so "it works on
# Python" has been an assertion about a capability rather than a measurement of one. This
# rubric is the only Python datapoint in the set.
#
# GROUND TRUTH IS SOURCE-DERIVED, WHICH MATTERS MORE HERE THAN ANYWHERE ELSE. The target is
# this repository, so an index-derived figure would move whenever the pipeline moved and the
# rubric would silently be grading the tool against itself. Every mark below was verified by
# reading the source at the pinned commit — the docstrings and code of the modules named,
# not a query reply.
#
# THE PIN IS LOAD-BEARING AND WILL GO STALE. This repository changes daily, which is exactly
# why #355 kept it out of the reference set before now. A grid run against a different commit
# is not comparable to this one; `preflight_target_revision` refuses on a mismatch rather than
# letting the two drift quietly.
#
# MOVING THE PIN IS ALLOWED ONLY WITH THE DIFF CHECKED. It moved once already, from the commit
# the marks were read at to the commit that added this file, and that is safe for exactly one
# reason: `git diff --stat <old>..<new> -- clew/` is EMPTY, so every fact below holds
# identically at both. A pin advanced without that check is a rubric whose ground truth was
# verified against code the run will not execute.
#
# THE PREDECESSOR IS RETIRED. `questions.md` was an unrun, stale draft explicitly marked in
# CLAUDE.md as not-a-grading-key. The seven QUESTIONS were good and are kept, re-verified
# against current behaviour; every MARK is new. Two of the draft's premises had gone stale in
# ways worth recording: Q1's Doxyfile fallback no longer exists (gh#333 replaced INPUT), and
# Q6's document-level slip now REFUSES rather than building green.
#
# NO COUNTS ARE WRITTEN IN THE FRONT MATTER. `marks` is the list's length.

target: tvanfossen/clew
commit: d091b1d1860fbf16109a7a01d9350a5aeb388235
version: 1.0.0
ground_truth_source: |-
  THIS REPOSITORY'S OWN SOURCE at the commit above, read directly. Not the index, and not
  any figure the pipeline reports about itself: the target is the tool, so an index-derived
  mark would grade the tool against its own output and move whenever the pipeline moved.

