      refs: []
      veto_safe: true
    - text: |-
        states that the predicate uses an existence test rather than a directory test, so both shapes are caught
      symbols: []
      refs: []
    - text: |-
        **reports that a directory-only test found nested CLONES while silently missing every SUBMODULE**, and that a plausible non-zero count is what made it look like a working detector
      symbols: []
      refs: []
    - text: |-
        notices that every unit fixture used a `.git` directory, so the suite was structurally incapable of catching it — the fixture matched the detector rather than the world
      symbols: []
      refs: []
    - text: |-
        **separates the TWO predicates and says they answer different questions** — one for descent (is there a separate git tree here?), one for ownership (did this repository commit it as a gitlink?)
