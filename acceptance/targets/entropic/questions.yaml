  - id: Q2
    title: |-
        Can entropic deadlock?
    prompt: |-
        Does entropic ever hold two mutexes at once, and if so is the acquisition order consistent? Report every case you find and say, for each one, how confident you are that it is real.
    marks:
    - text: |-
