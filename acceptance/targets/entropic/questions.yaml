      symbols: ['entropic_engine::api_mutex', 'HandleApiLock', 'std::lock_guard']
      refs: []
    - text: |-
        **names the `mutex_` collision**: six unrelated classes in entropic's own code declare a member literally named `mutex_`, so 30 guard sites and any name-keyed grouping conflate six different mutexes. Eight if the submodule is counted — cpp-httplib's `ThreadPool` and ggml's `spine_mem_pool_manager` — and either figure passes when the population is stated
      symbols: ['mutex_', 'ThreadPool', 'spine_mem_pool_manager']
      refs: []
    - text: |-
        finds the mutex that is declared and never acquired — `s_session_paths_mu` in `src/types/logging.cpp` — or states that it checked for such a case and reports the result
      symbols: ['s_session_paths_mu']
      refs: []
