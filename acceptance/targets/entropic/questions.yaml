ground_truth_source: |-
  ENTROPIC'S OWN SOURCE at the commit above for every source figure, and the live lock and
  thread rosters for the figures this rubric explicitly attributes to the index. The index
  figures were re-derived and confirmed before the atomisation pass; the source figures are
  independent of any pipeline version.

  Carries no `build_version` deliberately. The index-derived counts here are properties of
  entropic's code as this pipeline reads it, not of a schema revision, and a pinned schema
  number would refuse a rubric that is still correct. Where a figure could move with the
  pipeline, the mark accepts a band and says what it is counting.

