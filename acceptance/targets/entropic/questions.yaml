# SPDX-License-Identifier: MIT
#
# THE GRADING KEY, AS DATA. Generated from questions.md by scripts/rubric_to_yaml.py and
# then corrected by hand; the markdown is kept for its prose and is no longer the key.
#
# A mark's `symbols` and `refs` are DECLARED here rather than guessed from its prose. The
# markdown reader inferred them with regexes, so a mark's punctuation decided whether it
# was machine-checkable. Both directions were measured on the first target migrated: a
# whole-file citation extracted nothing and went to the LLM judge, which scored MISS with
# quote NONE while the answer named the file; and a junk token — a bare vendor prefix the
# regex lifted out of prose — awarded its mark unseen, because an objective HIT skips the
# judge entirely.
#
# CONVERSION IS MECHANICAL AND CARRIES THE DEFECTS ACROSS. The inferred evidence is
# preserved verbatim so the equivalence gate can compare like with like; correcting it is a
# separate, reviewable pass. Do not read a declared symbol here as one an author chose.
#
# `refs` entries are [file], [file, line] or [file, lo, hi]. A bare [file] is a whole-file
# citation, which the markdown reader could not express at all.
#
# NO COUNTS ARE WRITTEN. `marks` and `graded_marks` are the list's length and the fence
# arithmetic; every written count in this rubric's history has been wrong at some point.
#
# ── ATOMISATION, AND WHAT IT DOES TO THE COMMITTED RESULT ────────────────────────────────
# Q1's mutex-count mark and Q3's spawn-count mark were each ONE mark welding five separately
# failable requirements — the refusal, the basis, the population, the figure, and the
# submodule attribution. Split five ways each, so the rubric went from 79 marks to 87. This is
# the pass mbedtls Q1-Q4 had at #410 (33 compound marks -> 108 atomic) and entropic never did;
# a compound mark is graded by one binary judge call and is biased toward MISS for BOTH arms,
# which is why entropic's measured -1 was confounded with rubric shape rather than capability.
#
# `pre-release/result.md` RAN AGAINST THE 79-MARK VERSION and its figures stand for that
# rubric. They are NOT comparable to any run against this file, and the denominators differ,
# so do not put the two in one table. The result file says so too.
#
# EVERY FIGURE CARRIED INTO THE NEW MARKS WAS RE-VERIFIED against the live index at the pinned
# commit before the split, rather than copied on trust: 103 rows over 97 identities whole-repo,
# 52 external and 45 first-party, and 45 = 42 (`src/` + `include/`) + 3 (`tests/`), with
# 103 = 54 + 46 + 3 rows. All of it reproduced, so the split is a reshaping and not a
# correction — which is worth stating, because the last time this rubric was touched two of the
# "corrections" turned out to be measurements of the wrong tree.
target: tvanfossen/entropic
