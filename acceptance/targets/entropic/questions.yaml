      symbols: []
      refs: []
    - text: |-
        **when it quotes a WHOLE-REPOSITORY figure, it separates the submodule out** — 103 rows over 97 identities whole-repo, of which `extern/llama.cpp` contributes 54 rows / 52 identities and `tests/` 3 / 3. An unattributed 97 fails, because 52 of those belong to a different repository
      symbols: []
      refs: []
    - text: |-
        **notices `HookRegistry::mutexes_` is an ARRAY** — one declaration, `ENTROPIC_HOOK_COUNT_` == 23 physical `std::shared_mutex` objects, indexed by a runtime hook point — and says which way that cuts for a count
      symbols: ['HookRegistry::mutexes_', 'ENTROPIC_HOOK_COUNT_', 'std::shared_mutex']
      refs: []
    - text: |-
        **for one mutex it names, reports the critical-section EXTENT and what runs inside it** — which functions acquire it and what those sections call — and the report checks out against the source. Any of entropic's own mutexes is acceptable and the mark is that the extent is right; a mutex declared under `extern/llama.cpp` does not satisfy it, because the question asks what runs inside entropic's critical sections
      symbols: []
      refs: []
    - text: |-
        **reports the acquisition shape and gets it right: every acquisition in entropic's own code is scoped RAII**, `lock_guard` 148 / `shared_lock` 13 / `unique_lock` 11 over `src/` + `include/`, with no `lock()`/`unlock()` pair in those trees — and reads that as correct for a modern-C++ codebase rather than as a gap. `extern/llama.cpp` does lock manually (48 `lock()`/`unlock()`/`try_lock()` sites over 12 files), so reporting manual locking is a MISS only when it is attributed to entropic
