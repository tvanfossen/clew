      refs: []
    - text: |-
        **verifies it at both ends against the source** rather than asserting it — the two class headers each document their own locking invariant, and the seven call sites are in one file
      symbols: []
      refs: []
    - text: |-
        **finds at least one of the other two real nestings** — `SecondaryModelLoader::slots_mutex_` → `InferenceBackend::transition_mutex_` (in `release_role` / `shutdown`), or `LlamaCppBackend::mtp_mutex_` → `PromptCache::mutex_` (in `do_unload`). An answer that reports the authorization pair as the codebase's ONLY two-lock holding is incomplete, and this mark is the one that says so
      symbols: ['SecondaryModelLoader::slots_mutex_', 'InferenceBackend::transition_mutex_', 'release_role', 'LlamaCppBackend::mtp_mutex_', 'PromptCache::mutex_', 'do_unload']
      refs: []
    - text: |-
        **reports the ORDER as consistent** for whatever it finds — the outer lock is the same one every time in all three pairs — so no inversion is demonstrated
      symbols: []
      refs: []
    - text: |-
        **argues the no-inversion case structurally rather than by inspection**: `MCPKeySet` never names `MCPAuthorizationManager` and `InferenceBackend` never names `SecondaryModelLoader`, so the reverse order is not reachable at all for those pairs
      symbols: ['MCPKeySet', 'MCPAuthorizationManager', 'InferenceBackend', 'SecondaryModelLoader']
      refs: []
    - text: |-
        **does not fabricate a nesting.** Any reported pair whose inner call is a same-named method of an unrelated type is a MISS for this mark, however plausible — `.get()` on a `std::unique_ptr` is not `SecondaryModelLoader::get`, `.size()` on a container is not `MCPKeySet::size`, `.store()` on a `std::atomic` is not `PromptCache::store`
      symbols: ['std::unique_ptr', 'SecondaryModelLoader::get', 'MCPKeySet::size', 'std::atomic', 'PromptCache::store']
      refs: []
    - text: |-
        **states how it searched and why that method over-reports** on this codebase specifically: the inner call is named by an unqualified method name, and several of entropic's own method names collide with standard-library member names
      symbols: []
      refs: []
    - text: |-
        answers the question that was asked — whether entropic can deadlock — rather than listing findings. Consistent ordering in every pair found means no cycle is demonstrated
      symbols: []
      refs: []
    - text: |-
        **distinguishes "I found no inversion" from "there is no inversion"**, and says what its method could not have seen. A dispatch through a base-class pointer or a `std::function` is outside the reach of any static scan of this kind
      symbols: ['std::function']
      refs: []
    - text: |-
        spots that pairs 2 and 3 COMPOSE: `InferenceBackend::unload` calls the virtual `do_unload`, so one `release_role` call holds four mutexes in a chain no single function body shows
      symbols: ['InferenceBackend::unload', 'do_unload', 'release_role']
      refs: []
    - text: |-
        notes that `InferenceBackend::unload` fires a consumer-supplied hook callback while holding `transition_mutex_`, which is a re-entrancy hazard the source cannot resolve because the callback is external
      symbols: ['InferenceBackend::unload', 'transition_mutex_']
      refs: []
    - text: |-
        quantifies its own precision — states how many candidates its method produced and how many survived reading — rather than presenting a filtered list as if it were the raw result
      symbols: []
