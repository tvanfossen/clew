      symbols: []
      refs: []
    - text: |-
        gives the BASIS of whatever figure it reports — what was counted (declaration sites, lock identities, objects), not merely the number
      symbols: []
      refs: []
    - text: |-
        names the POPULATION the figure covers — which trees were counted
      symbols: []
      refs: []
    - text: |-
