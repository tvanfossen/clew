# SPDX-License-Identifier: MIT
#
# THE GRADING KEY, AS DATA. Schema and rules: acceptance/DESIGN.md.
#
# Every mark below was verified by reading RIOT source at the pinned commit — a shallow fetch of
# that exact sha, HEAD confirmed before anything was read. A mark is an ANSWER COMPONENT: what a
# complete answer contains, not what some tool happens to surface. clew models neither ISRs nor
# interrupt context today (gh#47), so the marks here describe what a firmware engineer needs and
# NOT what the index can currently produce — this target is a red before it is a green.

schema: 1

target: RIOT-OS/RIOT
commit: 50ae2eba8fe3c533539e68f1a64fd34d66c8d14b
ref: "2026.07"
version: 1.0.0

ground_truth: |
  RIOT source at the commit above, read directly from a shallow checkout at that sha. Every line
  number was taken from that tree with no modifications.

  WHY THIS TARGET. It is the only tree in the matrix with a second execution context. The
  question a firmware engineer asks first — "can this run in interrupt context, and does anything
  it calls block?" — has a complete answer spread across four files here, which is the
  multi-file shape DESIGN.md predicts should discriminate. It also carries all four ISR
  registration idioms in one repository (AVR `ISR(...)`, Cortex-M `*_IRQHandler` weak overrides,
  `__attribute__((interrupt))`, and the portable `irq_disable`/`irq_restore` pair), so a pattern
  set derived here is derived against the matrix rather than fitted to one vendor.

  COUNTS AT THE PIN, for scale rather than as marks: irq_disable appears in 196 files,
  irq_restore in 180, irq_is_in in 42, mutex_lock in 239, mutex_unlock in 250.

judge:
  model: claude-sonnet-4-5-20250929
  samples_when_weight_at_least: 2

index:
  declare: {}
  variant_note: |
    NO DECLARATION, deliberately. RIOT is built here exactly as it ships, because the question
    under test is what the source says about interrupt context — not what a chosen board or
    CPU variant compiles to. A `predefined` set naming one CPU would make every answer a claim
    about that port rather than about RIOT, and the ISR idioms this target exists for are spread
    across ports by construction.

questions:
  - id: Q1
    intent: |
      THE FIRMWARE QUESTION, and the one no tool in the 2026-09-10 inventory answers. Probes
      whether the agent stops at "mutex_lock takes a mutex" — one call for either arm — or
      follows the acquire path to the point where it yields, and recognises that a yield is a
      context switch and therefore invalid from an interrupt.

      The complete answer is assembled from four files and no single read reaches it: the public
      inline in a header, the internal in a .c, the blocking helper it calls, and the yield
      primitive declared in a third header. This is the multi-file shape the hypothesis predicts
      the index should win on — and today it cannot, because nothing in clew models interrupt
      context. That is the point of adding this target.

    prompt: |
      A device driver's interrupt handler in RIOT has data to hand to a waiting thread. It is
      about to call mutex_lock() on a mutex the thread also takes. Is that safe? Walk the call
      path and explain what actually happens, and say what the handler should do instead.

    marks:
      - text: names mutex_lock as the inline that delegates to mutex_lock_internal
        type: retrieval
        weight: 1
        evidence: |
          core/include/mutex.h:202 defines `static inline void mutex_lock(mutex_t *mutex)`,
          which calls `mutex_lock_internal(mutex, true)` when MAXTHREADS > 1.
        refs: [["core/include/mutex.h", 202]]

      - text: follows the contended path from mutex_lock_internal into the blocking helper
        type: retrieval
        weight: 2
        evidence: |
          core/mutex.c:95 `bool mutex_lock_internal(mutex_t *mutex, bool block)`; it opens an
          IRQ-disabled section at :101 and reaches `_block` (defined at :49) when the mutex is
          already held.
        refs: [["core/mutex.c", 95], ["core/mutex.c", 101], ["core/mutex.c", 49]]

      - text: >-
          identifies thread_yield_higher as the call that ends the blocking path, and states
          that it is a context switch
        type: conclusion
        weight: 3
        evidence: |
          core/mutex.c:87-88 restores the IRQ state and then calls `thread_yield_higher()`,
          declared at core/include/thread.h:398. This is the step that makes the path unsafe
          from an interrupt: there is no thread to switch away from.
        refs: [["core/mutex.c", 87, 88], ["core/include/thread.h", 398]]

      - text: >-
          concludes that calling mutex_lock from an interrupt handler is invalid because the
          contended path yields, and says so as a property of the path rather than of the name
        type: conclusion
        weight: 3
        evidence: |
          The uncontended path returns without yielding, so an answer that says "mutex_lock
          always blocks" is wrong in the same direction as one that says it never does. The
          defect is reachability of the yield, not the call itself.
        refs: [["core/mutex.c", 49], ["core/mutex.c", 88]]

      - text: names irq_is_in as the runtime predicate for "am I in interrupt context"
        type: retrieval
        weight: 2
        evidence: |
          core/lib/include/irq.h:89 `MAYBE_INLINE bool irq_is_in(void);`. RIOT's own assertion path uses it at
          core/lib/assert.c:34 to decide whether panicking is safe, which is the same question
          one level down.
        refs: [["core/lib/include/irq.h", 89], ["core/lib/assert.c", 34]]

      - text: >-
          proposes a non-blocking alternative — mutex_trylock, or handing off through a
          mechanism that does not yield
        type: conclusion
        weight: 2
        evidence: |
          `mutex_lock_internal(mutex, false)` is the non-blocking form the same function
          implements; core/include/mutex.h:80 documents that callers use the public wrappers
          rather than calling it directly.
        refs: [["core/include/mutex.h", 80], ["core/mutex.c", 95]]

  - id: Q2
    intent: |
      Probes whether the agent recognises the save/restore SHAPE of RIOT's critical section, as
      opposed to a lock/unlock pair. `irq_disable` returns the previous state and `irq_restore`
      takes it back, so the section is re-entrant by construction and the state lives in a local
      variable — which is exactly why a pattern set written for `lock()`/`unlock()` does not
      match it.

      A set question, because the discriminating cost is enumerating the files rather than
      explaining any one of them.

    prompt: |
      RIOT protects short critical sections by disabling interrupts rather than taking a lock.
      Describe the exact API contract for that, and list every file under core/ that opens such
      a section.

    marks:
      - text: >-
          states that irq_disable returns the previous interrupt state and irq_restore takes
          that value back
        type: retrieval
        weight: 3
        evidence: |
          core/lib/include/irq.h:46 `MAYBE_INLINE unsigned irq_disable(void);` and :72
          `MAYBE_INLINE void irq_restore(unsigned state);`. The saved value is carried in a
          local, e.g. core/mutex.c:101 `unsigned irq_state = irq_disable();`.
        refs: [["core/lib/include/irq.h", 46], ["core/lib/include/irq.h", 72], ["core/mutex.c", 101]]

      - text: >-
          concludes that because the previous state is returned and restored, sections nest
          without a depth counter
        type: conclusion
        weight: 2
        evidence: |
          A restore writes back what was saved rather than unconditionally enabling, so an inner
          section entered while interrupts were already disabled leaves them disabled on exit.
          Verified from the signatures at core/lib/include/irq.h:46 and :72.
        refs: [["core/lib/include/irq.h", 46], ["core/lib/include/irq.h", 72]]

      - text: every file under core/ that opens an interrupt-disabled critical section
        type: set
        weight: 1
        extract: |
          List every file path the answer names as containing a site where interrupts are
          disabled to open a critical section. Paths only, one per line, exactly as the answer
          writes them. If it names none, reply NONE.
        members:
          - {value: "core/msg.c", evidence: "irq_disable() at :71, passed straight into _msg_send rather than bound"}
          - {value: "core/thread.c", evidence: "irq_disable() at :72, return value discarded — the section is never reopened"}
          - {value: "core/cond.c", evidence: "irq_disable() at :34"}
          - {value: "core/mbox.c", evidence: "irq_disable() at :59"}
          - {value: "core/thread_flags.c", evidence: "irq_disable() at :56"}
          - {value: "core/thread_flags_group.c", evidence: "irq_disable() at :32"}
          - {value: "core/msg_bus.c", evidence: "irq_disable() at :39"}
          - {value: "core/mutex.c", evidence: "irq_disable() at :101"}
          - {value: "core/sched.c", evidence: "irq_disable() at :315, cast to void for the same reason"}

      - text: >-
          notes that mutex_unlock also runs inside such a section, so the mutex implementation
          is itself built on the interrupt primitive
        type: conclusion
        weight: 2
        evidence: |
          core/mutex.c:184 `void mutex_unlock(mutex_t *mutex)` opens at :186 and restores at
          :193 and :200.
        refs: [["core/mutex.c", 184], ["core/mutex.c", 186], ["core/mutex.c", 193, 200]]

      - text: >-
          observes that not every site binds the saved state — some pass it straight on and
          some discard it — so the idiom is not always a visible acquire/release pair
        type: conclusion
        weight: 3
        evidence: |
          core/msg.c:71 passes `irq_disable()` directly into `_msg_send`; core/thread.c:72 calls
          it for effect and drops the result; core/sched.c:315 casts it to void. All three
          disable interrupts and none binds a state variable.
        refs: [["core/msg.c", 71], ["core/thread.c", 72], ["core/sched.c", 315]]

      - text: >-
          notes that the primitives are MAYBE_INLINE, so on a port defining IRQ_API_INLINED
          they are always-inline statics rather than linked calls
        type: conclusion
        weight: 2
        evidence: |
          core/lib/include/irq.h:30-34 defines MAYBE_INLINE as
          `static inline __attribute__((always_inline))` under IRQ_API_INLINED and as nothing
          otherwise, so whether a call site is a call at all is a per-port property.
        refs: [["core/lib/include/irq.h", 30, 34]]
